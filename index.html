.analysis-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.analysis-table{width:100%;min-width:var(--analysis-min-width,420px);table-layout:fixed;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.analysis-table caption{text-align:left;font-size:14px;font-weight:600;padding:13px 12px;color:var(--text)}
.analysis-table th,.analysis-table td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle;text-align:right;min-width:84px}
.analysis-table th:first-child{text-align:left;min-width:125px;width:140px;position:sticky;left:0;z-index:1;background:var(--panel)}
.analysis-table thead th{font-size:11px;font-weight:500;color:var(--muted);max-width:170px;overflow-wrap:anywhere}
.analysis-table tbody th{font-weight:500;color:var(--muted)}
.analysis-table small{display:block;color:var(--muted);font-size:10px;line-height:1.5;margin-top:2px;white-space:nowrap}
.analysis-number{font-weight:600;color:var(--text)}
.analysis-bar-cell{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:60px}
.analysis-bar-cell>.analysis-number{min-width:2ch;text-align:right}
.analysis-bar-track{display:block;flex:1;height:7px;min-width:30px;background:var(--panel);border-radius:3px;overflow:hidden}
.analysis-bar-track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.analysis-empty{padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:20px 0}
.analysis-empty h3{font-size:14px;margin-bottom:6px}
.analysis-empty p{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.analysis-tag-present{color:var(--text)}
.analysis-tag-absent{color:var(--muted)}
@media(max-width:600px){.analysis-table th,.analysis-table td{padding:9px 8px}.analysis-table caption{padding:12px 8px}.analysis-table th:first-child{min-width:112px}.analysis-scroll{margin-top:16px}.analysis-note,.analysis-intro{font-size:12px}}

.analysis-scroll-hint{display:none;color:var(--muted);font-size:12px;margin:8px 0}@media(max-width:600px){.analysis-scroll-hint{display:block}}
.analysis-toolbar{margin-top:14px}.analysis-switch{margin-bottom:16px}
/* END DECK COMPARISON */

/** Pure collection, CSV, search and pairing logic. No browser dependencies. */
const APP_SCHEMA = 1;
const MAX_QUANTITY = 1000000;
function normalizeName(value) {
  return String(value ?? '').normalize('NFKC').replace(/[‘’`´]/g, "'").replace(/[‐‑–—]/g, '-').replace(/\s+/g, ' ').trim().toLocaleLowerCase('en-US');
}
function escapeHTML(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sumValues(obj) { return Object.values(obj).reduce((n, v) => n + Number(v), 0); }
function makeIndex(catalog) {
  const decks = new Map(catalog.decks.map(d => [d.id, d]));
  const themes = new Map(catalog.themes.map(t => [t.id, t]));
  const cards = new Map();
  for (const deck of catalog.decks) for (const entry of deck.cards) {
    const key = normalizeName(entry.name);
    if (!cards.has(key)) cards.set(key, {key, name:entry.name, isLand:entry.isLand, isBasic:entry.isBasic, decks:[], themeColors:[], metadata:false, printings:[]});
    const card = cards.get(key);
    card.decks.push(deck.id);
    if (!card.themeColors.includes(deck.color)) card.themeColors.push(deck.color);
    const seed = catalog.seedImages[entry.name];
    if (seed) card.fallbackImage = seed.image;
  }
  return {decks, themes, cards, byScryfallId:new Map(), byNumber:new Map()};
}
function hydrateIndex(index, printings) {
  for (const p of printings) {
    if (!p || typeof p.name !== 'string' || p.set !== 'j25') continue;
    const key = normalizeName(p.name);
    const card = index.cards.get(key) || {key, name:p.name, decks:[], themeColors:[], printings:[]};
    const existing = card.printings.findIndex(x => x.id === p.id);
    if (existing < 0) card.printings.push(p); else card.printings[existing] = p;
    card.printings.sort((a,b) => Number(a.collector_number) - Number(b.collector_number));
    const primary = card.printings[0];
    Object.assign(card, {metadata:true, manaCost:primary.mana_cost || '', manaValue:primary.cmc ?? null,
      type:primary.type_line || '', oracle:primary.oracle_text || primary.card_faces?.map(f => f.oracle_text).join('\n\n') || '',
      colors:primary.colors || [], identity:primary.color_identity || [], rarity:primary.rarity || '',
      keywords:primary.keywords || [], power:primary.power, toughness:primary.toughness,
      artist:primary.artist || '', flavor:primary.flavor_text || '', number:primary.collector_number,
      id:primary.id, oracleId:primary.oracle_id, scryfallUrl:primary.scryfall_uri, rulingsUrl:primary.rulings_uri,
      images:primary.image_uris || primary.card_faces?.[0]?.image_uris || {},
      faces:primary.card_faces || [], isLand:/\bLand\b/.test(primary.type_line), isBasic:/\bBasic Land\b/.test(primary.type_line)});
    index.cards.set(key, card);
    if (p.id) index.byScryfallId.set(p.id, key);
    index.byNumber.set(String(p.collector_number).replace(/^0+(?=\d)/,''), key);
  }
  return index;
}
/** Aggregate first: shared cards and identical halves must require extra copies. */
function requirements(decks, includeBasics = false) {
  const result = Object.create(null);
  for (const deck of decks) if (deck) for (const e of deck.cards) {
    if (!includeBasics && e.isBasic) continue;
    const key = normalizeName(e.name);
    result[key] = (result[key] || 0) + e.quantity;
  }
  return result;
}
function mergeCounts(a, b, multiplier = 1) {
  const out = Object.assign(Object.create(null), a);
  for (const [key, q] of Object.entries(b)) out[key] = (out[key] || 0) + q * multiplier;
  return out;
}
function allocationRequirements(allocations, index, includeBasics = false) {
  let out = Object.create(null);
  for (const [id, count] of Object.entries(allocations)) {
    const deck = index.decks.get(id);
    if (deck) out = mergeCounts(out, requirements([deck], includeBasics), count);
  }
  return out;
}
function remainingInventory(inventory, allocations, index, includeBasics = false) {
  const used = allocationRequirements(allocations, index, includeBasics);
  const out = Object.assign(Object.create(null), inventory);
  for (const [key, q] of Object.entries(used)) out[key] = Math.max(0, (out[key] || 0) - q);
  return out;
}
function coverage(required, inventory) {
  let matched = 0, total = 0, copies = Infinity;
  const missing = [];
  for (const [key, quantity] of Object.entries(required)) {
    const have = Math.max(0, inventory[key] || 0);
    total += quantity;
    matched += Math.min(quantity, have);
    copies = Math.min(copies, Math.floor(have / quantity));
    if (have < quantity) missing.push({key, quantity:quantity - have, required:quantity, have});
  }
  return {matched, total, missing, missingCount:total-matched, complete:total > 0 && matched === total, copies:Number.isFinite(copies) ? copies : 0, percent:total ? matched / total : 0};
}
function deckCoverage(deck, inventory, includeBasics = false) { return coverage(requirements([deck], includeBasics), inventory); }
function deckSignature(deck, index) {
  // Specificity is a discovery aid, never evidence that a physical booster was owned.
  return deck.cards.filter(e=>!e.isBasic).reduce((score,e)=>score + e.quantity / Math.max(1,index.cards.get(normalizeName(e.name))?.decks.length || 1), 0);
}
function rankCandidates(decks, inventory, index, includeBasics = false) {
  return decks.map(deck => ({deck, ...deckCoverage(deck, inventory, includeBasics), specificity:deckSignature(deck,index)}))
    .sort((a,b)=>b.percent-a.percent || a.missingCount-b.missingCount || b.specificity-a.specificity || a.deck.id.localeCompare(b.deck.id));
}
function takeDeckCopies(inventory, deck, includeBasics = false) {
  const used = Object.create(null);
  for (const [key, q] of Object.entries(requirements([deck], includeBasics))) {
    const take = Math.min(q, Math.max(0, inventory[key] || 0));
    if (take) used[key] = take;
  }
  const out = mergeCounts(inventory, used, -1);
  for (const key of Object.keys(out)) if (out[key] < 0) out[key] = 0;
  return out;
}
/** Leftover copies finance at most one listed match. Completes claim first. */
function rankExclusiveCandidates(decks, inventory, index, includeBasics = false) {
  let pool = Object.assign(Object.create(null), inventory);
  const ranked = rankCandidates(decks, inventory, index, includeBasics);
  const results = [];
  const taken = new Set();
  for (;;) {
    const next = ranked.find(c => !taken.has(c.deck.id) && deckCoverage(c.deck, pool, includeBasics).complete);
    if (!next) break;
    taken.add(next.deck.id);
    const cov = deckCoverage(next.deck, pool, includeBasics);
    results.push({deck: next.deck, ...cov, specificity: next.specificity});
    pool = takeDeckCopies(pool, next.deck, includeBasics);
  }
  const rest = rankCandidates(decks.filter(d => !taken.has(d.id)), pool, index, includeBasics);
  for (const c of rest) {
    const cov = deckCoverage(c.deck, pool, includeBasics);
    results.push({deck: c.deck, ...cov, specificity: c.specificity});
    pool = takeDeckCopies(pool, c.deck, includeBasics);
  }
  return results.sort((a,b)=>b.percent-a.percent || a.missingCount-b.missingCount || b.specificity-a.specificity || a.deck.id.localeCompare(b.deck.id));
}
/** A bounded, quantity-safe heuristic, explicitly NOT a unique/optimal decomposition. */
function suggestAllocation(decks, inventory, index, includeBasics = false, limit = 200) {
  let remaining = Object.assign(Object.create(null), inventory);
  const suggested = Object.create(null);
  const candidates = rankCandidates(decks, inventory, index, includeBasics).filter(c=>c.complete);
  for (let n=0;n<limit;n++) {
    const next = candidates.find(c=>deckCoverage(c.deck, remaining, includeBasics).complete);
    if (!next) break;
    suggested[next.deck.id]=(suggested[next.deck.id] || 0)+1;
    remaining = mergeCounts(remaining, requirements([next.deck], includeBasics), -1);
  }
  return {suggested, remaining, alternatives:candidates.length, capped:sumValues(suggested)===limit};
}
function allPairs(decks) {
  const pairs=[];
  for (let i=0;i<decks.length;i++) for (let j=i;j<decks.length;j++) pairs.push([decks[i].id,decks[j].id]);
  return pairs;

/** One paginated set query, cached locally. Images use returned CDN image_uris. */
class ScryfallService {
  constructor(){this.queue=Promise.resolve();this.lastRequest=0;this.dbPromise=null;this.busy=false;}
  async db(){
    if(typeof indexedDB==='undefined')return null;
    if(!this.dbPromise)this.dbPromise=new Promise(resolve=>{
      const request=indexedDB.open('jumpstart-atlas-data',1);
      const timer=setTimeout(()=>resolve(null),1800);
      request.onupgradeneeded=()=>request.result.createObjectStore('cache');
      request.onsuccess=()=>{clearTimeout(timer);resolve(request.result);};
      request.onerror=request.onblocked=()=>{clearTimeout(timer);resolve(null);};
    });
    return this.dbPromise;
  }
  async readCache(key){
    try{const db=await this.db();if(!db)return null;return await new Promise(resolve=>{const r=db.transaction('cache').objectStore('cache').get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null);});}catch{return null;}
  }
  async writeCache(key,value){
    try{const db=await this.db();if(!db)return false;return await new Promise(resolve=>{const t=db.transaction('cache','readwrite');t.objectStore('cache').put(value,key);t.oncomplete=()=>resolve(true);t.onerror=()=>resolve(false);});}catch{return false;}
  }
  request(url,{allowEmpty=false}={}){
    const task=async()=>{
      for(let attempt=0;attempt<3;attempt++){
        await new Promise(r=>setTimeout(r,Math.max(0,200-(Date.now()-this.lastRequest))));
        const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);
        try{
          this.lastRequest=Date.now();
          const response=await fetch(url,{headers:{Accept:'application/json'},signal:controller.signal});
          if(response.status===429||response.status>=500){
            if(attempt===2)throw new Error(`Scryfall is temporarily unavailable (${response.status}). Try again later.`);
            const wait=Math.min(60,Number(response.headers.get('Retry-After'))||2**(attempt+1))*1000;
            clearTimeout(timeout);await new Promise(r=>setTimeout(r,wait));continue;
          }
          if(response.status===404){
            const data=await response.json().catch(()=>null);
            if(allowEmpty&&data?.code==='not_found')return {object:'list',total_cards:0,data:[],has_more:false};
            throw new Error(data?.details||'Scryfall returned 404.');
          }
          if(!response.ok)throw new Error(`Scryfall returned ${response.status}. Your collection is unaffected.`);
          return await response.json();
        }finally{clearTimeout(timeout);}
      }
    };
    const promise=this.queue.then(task,task);this.queue=promise.catch(()=>{});return promise;
  }
  async search(query){
    const hits=new Set();
    let url='https://api.scryfall.com/cards/search?unique=cards&q='+encodeURIComponent(query);
    while(url){
      if(!String(url).startsWith('https://api.scryfall.com/'))throw new Error('Unexpected search host.');
      const data=await this.request(url,{allowEmpty:true});
      if(!data||data.object==='error'){
        if(data?.code==='not_found')return hits;
        throw new Error(data?.details||'Scryfall search failed.');
      }
      for(const c of data.data||[]){
        if(c.id)hits.add(c.id);
        if(c.oracle_id)hits.add(c.oracle_id);
        if(c.name)hits.add(normalizeName(c.name));
      }
      url=data.has_more&&data.next_page?data.next_page:'';
    }
    return hits;
  }
  async load({force=false,onProgress=()=>{}}={}){
    const cache=await this.readCache('j25');
    if(cache?.cards?.length){onProgress({cards:cache.cards,complete:true,cached:true,date:cache.date});if(!force&&Date.now()-cache.date<24*60*60*1000)return cache;}
    if(this.busy)return cache;
    this.busy=true;
    try{
      let url='https://api.scryfall.com/cards/search?q=set%3Aj25+lang%3Aen&unique=prints&order=set&include_variations=true';
      const cards=[];let pages=0,expectedTotal=null;
      while(url){
        if(++pages>20)throw new Error('Unexpectedly large set response. Sync stopped safely.');
        const data=await this.request(url);
        if(!Array.isArray(data.data))throw new Error('Scryfall returned an unexpected response.');
        cards.push(...data.data.filter(c=>c.set==='j25'));
        if(Number.isInteger(data.total_cards))expectedTotal=data.total_cards;
        onProgress({cards:[...cards],total:data.total_cards,complete:false,cached:false,date:Date.now()});
        url=data.has_more?data.next_page:null;
        if(url && !url.startsWith('https://api.scryfall.com/'))throw new Error('Unexpected pagination host.');
      }

  }
  async relatedToken(id){
    const key='token:'+id,cache=await this.readCache(key);
    if(cache?.card&&Date.now()-cache.date<7*24*60*60*1000)return cache.card;
    try{
      const card=await this.request('https://api.scryfall.com/cards/'+encodeURIComponent(id));
      if(!card?.id||!card.name)throw new Error('Unexpected token response.');
      await this.writeCache(key,{date:Date.now(),card});return card;
    }catch(error){if(cache?.card)return cache.card;throw error;}
  }
  async rulings(card){
    if(!card.id)return [];
    const key='rulings:'+card.id,cache=await this.readCache(key);

    const items=Array.isArray(data.data)?data.data:[];
    await this.writeCache(key,{date:Date.now(),items});return items;
  }
}

function filteredThemes(){return CATALOG.themes.filter(t=>

  (ui.packFilter!=='favorites'||collection.favorites.includes(t.id))&&visibleThemeVariants(t).length>0
);}

ks">${icon('plus')}</button></div>`)}${moreMenuHTML('explore','<button class="text-button" data-action="random">Surprise me with a mix</button><button class="text-button" data-action="guide">How Jumpstart works</button>')}</div>${themes.length?Object.entries(CATALOG.colors).map(([color,info])=>{

 }).join(''):emptyHTML('No themes in this corner.','Try another color or clear your collection filter. All 46 themes are still here.','reset-filters','Clear filters','compass')}<p class="catalog-note">${themes.length} of 46 themes${ui.showDetails?' · '+(collection.settings.includeBasics?'Basic lands are required.':'Basic lands are assumed available.'):''}</p></section>${footerHTML()}`;}

// Sorting and stacking only affect presentation; samples retain their original draw order.
function openingHandGroups(keys){
  const lands=new Map(),nonlands=[];
  for(const key of keys){const card=idx.cards.get(key);if(card.isLand)lands.set(key,(lands.get(key)||0)+1);else nonlands.push(key);}
  const manaValue=key=>{const value=idx.cards.get(key).manaValue;return Number.isFinite(value)&&value>=0?value:Infinity;};
  nonlands.sort((a,b)=>manaValue(a)-manaValue(b)||idx.cards.get(a).name.localeCompare(idx.cards.get(b).name));
  return {nonlands,lands:[...lands].map(([key,quantity])=>({key,quantity}))};
}

function tokensButton(decks){return `<button class="btn btn-secondary btn-small" data-action="deck-tokens" data-decks="${decks.join(',')}">${icon('cards')}View tokens</button>`;}
async function loadDeckTokens(){
  const m=ui.modal;if(m?.kind!=='tokens'||m.loading)return;
  m.loading=true;m.error='';renderModal();
  try{
    const cards=[...new Set(m.decks.flatMap(id=>idx.decks.get(id).cards.map(c=>normalizeName(c.name))))].map(key=>idx.cards.get(key));
    if(cards.some(c=>!c.metadata))throw new Error(ui.connection==='loading'?'Card data is still loading. Try again once Scryfall finishes syncing.':'Card data is unavailable. Connect to the internet and sync Scryfall in Settings, then try again.');
    const parts=new Map();
    for(const card of cards)for(const part of card.printings.flatMap(p=>p.all_parts||[])){
      if(!['token','emblem'].includes(part.component)||!part.id)continue;
      if(!parts.has(part.id))parts.set(part.id,{...part,sources:new Set()});
      parts.get(part.id).sources.add(card.name);
    }
    const items=new Map();let failed=0;
    for(const part of parts.values()){
      try{
        const token=await scryfall.relatedToken(part.id),key=token.oracle_id||token.id;
        if(!items.has(key))items.set(key,{token,sources:new Set()});
        for(const source of part.sources)items.get(key).sources.add(source);
      }catch{failed++;}
      m.items=[...items.values()];if(ui.modal===m)renderModal();
    }
    if(failed)m.error=`${failed} token ${failed===1?'could':'entries could'} not load. Try again to load the remaining tokens.`;
  }catch(error){m.error=error.message;}
  finally{m.loading=false;if(ui.modal===m)renderModal();}
}

// BEGIN DECK COMPARISON
// Full published lists, independent of filters, ownership and displayed lands.
function deckAnalysis(decks,index=idx){
  const result={total:0,lands:0,nonlands:0,creatures:0,otherSpells:0,unknownTypes:0,knownMana:0,unknownMana:0,manaSum:0,averageMana:null,curve:Array(8).fill(0),roles:Object.fromEntries(Object.keys(DRAFT_ROLES).map(role=>[role,0])),tags:[]};
  for(const deck of decks.filter(Boolean)){
    for(const tag of index.themes.get(deck.themeId)?.tags||[])if(!result.tags.includes(tag))result.tags.push(tag);
    for(const entry of deck.cards){
      const quantity=entry.quantity??1,card=index.cards.get(normalizeName(entry.name));
      result.total+=quantity;
      for(const role of cardDraftTags(entry))result.roles[role]=(result.roles[role]||0)+quantity;
      if(entry.isLand){result.lands+=quantity;continue;}
      result.nonlands+=quantity;
      if(card?.metadata&&card.type){if(/\bCreature\b/.test(card.type))result.creatures+=quantity;else result.otherSpells+=quantity;}
      else result.unknownTypes+=quantity;
      const mv=card?.manaValue;
      if(typeof mv==='number'&&Number.isFinite(mv)&&mv>=0){
        result.knownMana+=quantity;result.manaSum+=mv*quantity;result.curve[Math.min(7,Math.floor(mv))]+=quantity;
      }else result.unknownMana+=quantity;
    }
  }
  result.averageMana=result.knownMana?result.manaSum/result.knownMana:null;
  return result;
}
function deckAnalysisHTML(series,{kind='versions'}={}){
  const items=series.filter(item=>item.decks.some(Boolean)).map(item=>({...item,analysis:deckAnalysis(item.decks)}));
  if(!items.length)return '<div class="deck-analysis"><p class="analysis-note">Choose a pack to see its analysis.</p></div>';
  const head=`<thead><tr><th scope="col">Measure</th>${items.map(item=>`<th scope="col">${e(item.label)}</th>`).join('')}</tr></thead>`;
  const table=(caption,rows,extra='')=>`<div class="analysis-scroll" id="analysis-${kind}-${caption.toLowerCase().replace(/[^a-z0-9]+/g,'-')}" data-shelf="analysis-${kind}-${caption.toLowerCase().replace(/[^a-z0-9]+/g,'-')}" role="region" aria-label="${e(caption)}" tabindex="0"><table class="analysis-table" style="--analysis-min-width:${items.length===1?0:Math.max(420,140+items.length*120)}px"><caption>${e(caption)}</caption>${head}<tbody>${rows}</tbody></table></div>${extra}`;
  const row=(label,values)=>`<tr><th scope="row">${e(label)}</th>${values.map(value=>`<td>${value}</td>`).join('')}</tr>`;
  const number=(value)=>`<span class="analysis-number">${value}</span>`;
  const values=(fn)=>items.map(item=>fn(item.analysis));
  const stats=table('Deck statistics',[
    row('Cards',values(a=>number(a.total))),row('Lands',values(a=>number(a.lands))),row('Nonlands',values(a=>number(a.nonlands))),
    row('Creatures',values(a=>`${number(a.creatures)}${a.unknownTypes?'<small>known</small>':''}`)),
    row('Other nonlands',values(a=>`${number(a.otherSpells)}${a.unknownTypes?'<small>known</small>':''}`)),
    row('Unknown card types',values(a=>number(a.unknownTypes))),
    row('Avg. nonland mana',values(a=>`${number(a.averageMana===null?'—':a.averageMana.toFixed(2))}<small>${a.knownMana}/${a.nonlands} copies known</small>`))
  ].join(''));
  // Each chart uses one scale across all its measures and compared series.
  const bars=(caption,measures,read,extra='')=>{
    const maximum=Math.max(1,...measures.flatMap(measure=>items.map(item=>read(item.analysis,measure.key))));
    return table(caption,measures.map(measure=>row(measure.label,items.map(item=>{const count=read(item.analysis,measure.key);return `<span class="analysis-bar-cell"><span class="analysis-bar-track" aria-hidden="true"><i style="width:${count/maximum*100}%"></i></span>${number(count)}</span>`;}))).join(''),extra);
  };
  const anyMana=items.some(item=>item.analysis.knownMana);
  const mana=anyMana?bars('Nonland mana curve',Array.from({length:8},(_,key)=>({key,label:key===7?'7+':String(key)})),(a,key)=>a.curve[key],`<p class="analysis-note">${items.some(item=>item.analysis.unknownMana)?'Known mana values only; missing copies are excluded from the bars. ':''}Mana value uses X = 0. All bars share one scale.</p>`):'<section class="analysis-empty"><h3>Nonland mana curve</h3><p>Mana data is unavailable. Load card data to see the curve.</p><button class="text-button" data-action="sync">Load card data</button></section>';
  const unknownMana=table('Mana data coverage',row('Unknown mana values',values(a=>number(a.unknownMana))));
  const bread=bars('BREAD assignments',['B','R','E','A','D'].map(key=>({key,label:DRAFT_ROLES[key][0]})),(a,key)=>a.roles[key]||0,'<p class="analysis-note">Counts card copies in the full list. A card can contribute to multiple roles; these are draft aids, not ratings of deck strength.</p>');
  const support=bars('Supporting roles',['draw','ramp','trick','recursion','tokens','synergy'].map(key=>({key,label:DRAFT_ROLES[key][0]})),(a,key)=>a.roles[key]||0);
  const tags=[...new Set(items.flatMap(item=>item.analysis.tags))];
  let tagNote='Versions of the same theme share its tags. Supporting-role counts above show differences in their cards.';
  if(kind==='mix'){
    const combined=items.find(item=>item.decks.filter(Boolean).length===2);
    if(combined){
      const pair=combined.decks.filter(Boolean).map(deck=>deck.id),syn=pairSynergy(pair),ds=combined.decks.filter(Boolean);
      const colorBonus=ds[0].color===ds[1].color?2:ds.every(deck=>deck.color!=='M')?1:0,sameTheme=ds[0].themeId===ds[1].themeId?1:0;
      tagNote=`${syn.score} tag synergy: ${syn.shared.length} shared ${syn.shared.length===1?'tag':'tags'} × 4 + ${colorBonus} color bonus${sameTheme?' + 1 same-theme bonus':''}. This is the existing pairing heuristic, not a winrate. Combined counts include both halves.`;
    }else tagNote='Choose a second pack to compare shared theme tags and the combined deck.';
  }
  const tagTable=tags.length?table('Theme tags',tags.map(tag=>row(tag,items.map(item=>item.analysis.tags.includes(tag)?'<span class="analysis-tag-present">Yes</span>':'<span class="analysis-tag-absent">No</span>'))).join('')):'<h3>Theme tags</h3><p class="analysis-note">No theme tags are available.</p>';
  return `<section class="deck-analysis" aria-label="${kind==='mix'?'Mix':'Version'} analysis"><p class="analysis-intro">Full published lists · counts include every copy</p>${items.length>1?'<p class="analysis-scroll-hint">Swipe or scroll tables sideways to compare.</p>':''}${stats}${mana}${unknownMana}${bread}${support}${tagTable}<p class="analysis-note">${e(tagNote)}</p></section>`;
}

function compareDialogHTML(m){const t=idx.themes.get(m.theme),ds=t.variants.map(id=>idx.decks.get(id)),maps=ds.map(d=>requirements([d],true));const keys=[...new Set(ds.flatMap(d=>d.cards.filter(c=>!c.isLand).map(c=>normalizeName(c.name))))];const common=keys.filter(k=>maps.every(x=>(x[k]||0)>0));const differences=keys.filter(k=>!maps.every(x=>x[k]===maps[0][k]));const controls=`<div class="segmented analysis-switch" role="group" aria-label="Version comparison view">${[['cards','Cards'],['analysis','Analysis']].map(([mode,label])=>`<button id="comparison-mode-${mode}" data-action="comparison-mode" data-mode="${mode}" aria-pressed="${!!m.analysis===(mode==='analysis')}" class="${!!m.analysis===(mode==='analysis')?'active':''}">${label}</button>`).join('')}</div>`;return dialogFrame(`${t.name} · compare versions`,controls+(m.analysis?deckAnalysisHTML(ds.map(d=>({label:`Version ${d.variant}`,decks:[d]})),{kind:'versions'}):`<p class="muted">Compare nonland cards across published variants. Shared cards establish the theme; the differences help identify the exact version.</p><div class="notice subtle"><div><strong>${common.length} shared nonland names</strong><p>${common.map(k=>`<button class="text-button" data-action="card" data-key="${e(k)}">${e(idx.cards.get(k).name)}</button>`).join(' · ')}</p></div></div><div class="comparison-scroll"><table class="comparison-table"><thead><tr><th>Different cards</th>${ds.map(d=>`<th><button class="text-button" data-action="reveal-pack" data-id="${d.id}">Version ${d.variant}</button></th>`).join('')}</tr></thead><tbody>${differences.map(k=>`<tr><td><button class="text-button" data-action="card" data-key="${e(k)}">${e(idx.cards.get(k).name)}</button></td>${maps.map(x=>`<td class="mono">${x[k]||'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="form-hint">All variants contain 20 cards. Land differences are visible in each expanded pack with “Show lands.”</p>`),'','wide');}
function saveDialogHTML(m){const saved=m.id?collection.saved.find(s=>s.id===m.id):null;const pair=m.pair||saved?.pair||ui.pair;if(!completePair(pair))return dialogFrame('Choose two packs first','<p>Open the mixing room to finish your pairing.</p>');return dialogFrame(saved?'Edit your play deck':'Keep this combination',`<div class="selected-packs-title">${pair.map(id=>{const d=idx.decks.get(id);return `<span>${mana(d.color)}${e(d.name)} <small>v${d.variant}</small></span>`;}).join('<span>＋</span>')}</div><form id="save-deck-form" class="form-stack"><label class="form-field">Deck name<input id="saved-name" class="input" name="name" maxlength="120" required value="${e(m.draftName??saved?.name??pairTitle(pair))}" placeholder="A memorable name for a magical mix"></label><label class="form-field">Notes<textarea id="saved-notes" name="notes" class="input" rows="4" maxlength="2000" placeholder="Favorite plays, friends you played with, or a little strategy…">${e(m.draftNotes??saved?.notes??'')}</textarea></label><label class="toggle-label"><input type="checkbox" id="saved-favorite" name="favorite" ${m.draftFavorite??saved?.favorite?'checked':''}>Star this deck</label><p class="form-hint">A saved recipe does not change your inventory or reserve extra cards. Wish-list combinations are welcome.</p></form>`,`<button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="save-deck-form">${icon('bookmark')}${saved?'Save changes':'Save play deck'}</button>`,'small');}

function guideHTML(searchOnly=false){return dialogFrame(searchOnly?'Find exactly the card you need':'A little guidance, a lot of possibilities',searchOnly?`<p class="muted">The query box is <a href="https://scryfall.com/docs/syntax" target="_blank" rel="noopener noreferrer">Scryfall search syntax</a>. Advanced filters write those tokens for you. Results are Scryfall hits that also exist in the J25 catalog. <code>set:j25</code> is implied unless you specify a set.</p><div class="help-grid">${[['t:creature c:g mv<=3','Type, color, and mana value — the same operators as Scryfall.'],['o:"draw a card"','Oracle text. Use ~ as the card name.'],['c=wu','Exactly these colors. c:wu includes them; c<=wu is at most them.'],['id:esper t:instant','Commander identity. f:commander, banned:legacy, game:paper also work.'],['pow>=4 r:rare','Power, toughness, loyalty, rarity, artist, flavor, prices.'],['(t:angel or t:demon) o:flying','OR and parentheses are evaluated by Scryfall.'],['theme:angels','Atlas-only: cards in that Jumpstart theme.'],['is:owned -t:land','Atlas-only ownership. is:unowned and is:missing are the same local filter.']].map(([q,t])=>`<div><button class="query-chip" data-action="modal-query" data-query="${e(q)}">${e(q)}</button><p>${e(t)}</p></div>`).join('')}</div><p class="notice subtle">If Scryfall is unreachable, a smaller local matcher runs instead. Pack color is not substituted for a card’s actual color.</p>`:`<div class="guide-step"><span>01</span><div><h3>Find your theme</h3><p>Move down through colors and sideways through themes. Drag a shelf, use its arrows, or switch to a grid. Open a theme to inspect its exact versions in a dialog. Every card shelf can switch between Horizontal and Grid. Filter by unowned versions or a theme tag such as Flying, Tokens, or Lifegain. Lands stay tucked away until you need them.</p></div></div><div class="guide-step"><span>02</span><div><h3>Make the atlas yours</h3><p>Use Import collection in the sidebar to upload a CSV (including Mythic Tools-style exports), inspect variant matches, and confirm packs from available cards. A “Buildable” badge is not an ownership claim. “Add known pack” adds the actual 20 cards and confirms that exact pack; “Confirm from cards” only allocates existing copies.</p></div></div><div class="guide-step"><span>03</span><div><h3>Mix, play, repeat</h3><p>Add two pack variants to the mixing room. Check the combined 40-card list, see shortages, and save a named play deck. Pairings are unordered, and identical variants are allowed when you have enough copies. Cards reserved for another exact version are unavailable until you release that pack.</p></div></div><p class="notice subtle">Pack, card, and play-deck dialogs have Previous / Next controls for the list you opened. Arrow keys also navigate. Back returns to the parent dialog without losing its scroll position. Unowned cards have zero copies; unowned pack versions are those you have not confirmed.</p><div class="notice subtle">${icon('lock')}Your collection lives on this browser and device. Export a JSON backup to move it or protect it before clearing browser data. Import files never leave your browser.</div><div class="row wrap gap-sm"><span><kbd>/</kbd> Card search</span><span><kbd>← →</kbd> Across a shelf / Previous & next in dialogs</span><span><kbd>↑ ↓</kbd> Between color shelves</span><span><kbd>Esc</kbd> Close a dialog</span></div>`,`<button class="btn btn-primary" data-action="close-modal">${searchOnly?'Back to browsing':'Let’s explore'}${icon('arrow')}</button>`,'wide');}
function settingsHTML(about=false){const persistent=typeof navigator.serviceWorker!=='undefined'&&location.protocol!=='file:'&&!window.JSATLAS_STANDALONE;return dialogFrame(about?'About this atlas':'Settings & backups',`${!about?`<section class="settings-section"><h3>Collection matching</h3><label class="toggle-label"><input type="checkbox" id="include-basics" ${collection.settings.includeBasics?'checked':''}>Require basic land copies when checking ownership</label><p class="form-hint">Default: basic lands are assumed available. Nonbasic lands always count. Enabling this also checks your confirmed packs, so add their basic lands first.</p></section><section class="settings-section"><h3>Your data, in your hands</h3><p class="muted">Collection quantities, confirmed packs, starred themes, and saved recipes are stored in this browser. There is no cloud account or cross-device sync.</p><div class="row wrap gap-sm"><button class="btn btn-secondary" data-action="backup">${icon('download')}Export full backup</button><button class="btn btn-secondary" data-action="restore-backup">${icon('upload')}Restore backup</button><input id="restore-file" type="file" accept=".json,application/json" hidden><button class="btn btn-secondary" data-action="copy-inventory">Copy card list</button></div>${recoveryRaw!==null?`<div class="notice warning"><div><p>Unreadable local data has not been overwritten. Export it for recovery, then reset or restore a valid backup.</p><button class="btn btn-secondary btn-small" data-action="recovery-export">Export unreadable data</button></div></div>`:''}<button class="text-button" style="color:var(--red);margin-top:18px" data-action="reset-data">${icon('trash')}Reset all local collection data</button></section><section class="settings-section"><h3>Card data & offline images</h3><p class="muted">The 121 decklists are bundled. Scryfall supplies card images, rules, mana, rarity, and printings in a paginated set sync, cached in IndexedDB for 24 hours.</p><div class="row between wrap"><span class="status-line"><i class="live-dot"></i>${ui.cardCount} loaded printings${ui.lastSync?' · '+e(new Date(ui.lastSync).toLocaleDateString()):''}</span><button class="btn btn-secondary btn-small" data-action="sync" ${ui.connection==='loading'?'disabled':''}>${icon('refresh')}Refresh card data</button></div>${ui.syncMessage?`<p class="form-hint">${e(ui.syncMessage)}</p>`:''}<p class="form-hint">${persistent?'The static-server edition caches viewed card images when its service worker is active. You may also cache all loaded J25 card images below. Browser storage can be evicted; downloaded assets in the source edition are the durable offline option.':'This single-file or file:// edition loads images from the CDN. For offline images, run the source edition and its download:images script.'}</p>${persistent?`<div class="row gap-sm"><button class="btn btn-secondary btn-small" data-action="cache-art" ${!ui.cardCount||ui.cacheProgress?'disabled':''}>${icon('download')}Cache all card images</button>${ui.cacheProgress?`<span class="muted">${ui.cacheProgress.done} / ${ui.cacheProgress.total}${ui.cacheProgress.failed?' · '+ui.cacheProgress.failed+' unavailable':''}</span><button class="text-button" data-action="cancel-cache">Cancel</button>`:''}</div>`:''}</section>`:''}<section class="settings-section"><div class="eyebrow">JUMPSTART ATLAS · 1.0</div><h3>46 themes. 121 variants. One connected collection.</h3><p class="muted">J25 decklists are transcribed from the published Foundations Jumpstart booster themes. Version numbers follow the order on that page; they are not printed pack identifiers. The 7,381 pairings include identical variants and count A + B only once.</p><p class="muted">Card ownership is combined by English card name, not exact printing, language, foil finish, or condition. A CSV can show what you can build, not prove which original sealed booster it came from. Suggested allocations are quantity-safe heuristics, not a unique or guaranteed optimal decomposition.</p><div class="source-note"><a class="text-button" href="${e(CATALOG.source)}" target="_blank" rel="noopener noreferrer">Wizards of the Coast · published J25 decklists ${icon('external')}</a><p>Catalog reviewed September 13, 2026. Two published lists have a missing basic land:</p>${CATALOG.sourceNotes.filter(n=>n.deckId).map(n=>`<p><strong>${e(idx.decks.get(n.deckId).name)} v${idx.decks.get(n.deckId).variant}.</strong> ${e(n.note)} <a href="${e(n.url)}" target="_blank" rel="noopener noreferrer">Cross-check</a></p>`).join('')}</div></section><section class="settings-section"><h3>Attribution & privacy</h3><p class="muted">An unofficial fan project, not affiliated with or endorsed by Wizards of the Coast or Scryfall. Magic: The Gathering, card names, rules, and artwork are owned by Wizards of the Coast and their credited artists. Card metadata and CDN images are provided by Scryfall; a few startup images use mtg.wtf.</p><p class="muted">Your collection is never sent with card-data requests. Scryfall and image hosts may receive ordinary network request information such as your IP address. There are no analytics, advertising scripts, or application trackers.</p></section>`,`<button class="btn btn-secondary" data-action="close-modal">Close</button>`,'wide');}

function lazyImages(scope){if(!imageObserver)imageObserver=new IntersectionObserver(entries=>{for(const item of entries)if(item.isIntersecting){loadImage(item.target);imageObserver.unobserve(item.target);}},{rootMargin:'500px'});for(const img of scope.querySelectorAll('img[data-src]')){if(img.dataset.eager==='true')loadImage(img);else imageObserver.observe(img);}}
function loadImage(img){if(!img.dataset.src)return;img.onload=()=>{img.classList.add('loaded');img.style.opacity='1';};img.onerror=()=>{img.hidden=true;img.style.display='none';};img.src=img.dataset.src;delete img.dataset.src;}

function updateURL(replace=false){const params=new URLSearchParams();if(ui.view==='cards'&&ui.search)params.set('q',ui.search);if(ui.view==='pairings'&&ui.pair.some(Boolean))params.set('packs',ui.pair.join(','));if(ui.view==='explore'&&ui.expanded?.id)params.set('pack',ui.expanded.id);const hash='#'+ui.view+(params.size?'?'+params.toString():'');if(location.hash!==hash)try{history[replace?'replaceState':'pushState']({},'',hash);}catch{location.hash=hash;}}

function pairAdd(id,slot=null){
  if(!idx.decks.has(id))return;
  if(slot===null)slot=[0,1].find(n=>!ui.pair[n]);
  if(slot===undefined){showModal('picker',{slot:1,query:idx.decks.get(id).name});toast('Your two slots are full. Choose a replacement for pack 2.');return;}
  if(![0,1].includes(slot))return;
  ui.pair=[ui.pair[0]||null,ui.pair[1]||null];ui.pair[slot]=id;ui.pairPage=1;
  updateURL(true);closeModal(true);render();toast(`${idx.decks.get(id).name} v${idx.decks.get(id).variant} added to your mix.`);
}
function randomIndex(length){
  if(globalThis.crypto?.getRandomValues){const values=new Uint32Array(1),limit=4294967296-(4294967296%length);do{crypto.getRandomValues(values);}while(values[0]>=limit);return values[0]%length;}
  return Math.floor(Math.random()*length);
}
function randomPair(slot=null){
  const other=slot===null?null:ui.pair[1-slot];
  const pairs=filteredPairs({selected:other?[other]:[],sort:false});
  if(slot===null){
    const options=pairs.filter(pair=>!completePair(ui.pair)||pairKey(pair)!==pairKey(ui.pair));
    if(!options.length){toast('No different pairing matches these filters. Broaden the filters to shuffle.',true);return;}
    ui.pair=[...options[randomIndex(options.length)]];
  }else{
    const options=[...new Set(pairs.flatMap(pair=>{if(!other)return pair;const rest=[...pair];rest.splice(rest.indexOf(other),1);return rest;}))].filter(id=>id!==ui.pair[slot]);
    if(!options.length){toast('No different pack matches these filters with the other half. Broaden the filters to shuffle.',true);return;}
    ui.pair=[ui.pair[0]||null,ui.pair[1]||null];ui.pair[slot]=options[randomIndex(options.length)];
  }
  ui.pairPage=1;if(ui.view!=='pairings')navigate('pairings');else{updateURL(true);render();}
  toast(slot===null?'A fresh combination, ready to explore.':`Pack ${slot+1} shuffled.`);
}

function commitImport(){const m=ui.import,r=m?.result;if(!r||!r.total||r.issues.length&&!m.skipIssues)return;let next=structuredClone(collection);next.inventory=m.mode==='add'?mergeCounts(next.inventory,r.inventory):{...r.inventory};if(m.mode==='replace'&&m.resetAllocations)next.allocations={};if(Object.values(next.inventory).some(q=>q>MAX_QUANTITY)){toast('Adding this file would exceed the per-card quantity limit.',true);return;}if(m.confirmGroups){for(const g of r.groupMatches.filter(g=>g.exact.length===1)){const id=g.exact[0],available=remainingInventory(next.inventory,next.allocations,idx,next.settings.includeBasics);if(deckCoverage(idx.decks.get(id),available,next.settings.includeBasics).complete)next.allocations[id]=(next.allocations[id]||0)+1;}}
 if(saveCollection(next,`${r.total.toLocaleString()} card copies ${m.mode==='add'?'added':'imported'}. Review your variant matches.`,true)){closeModal(true);ui.import=null;ui.collectionTab='matches';navigate('collection');}}

async function syncCards(force=false){if(scryfall.busy)return;ui.connection='loading';ui.syncMessage='';render();try{const result=await scryfall.load({force,onProgress:progress=>{hydrateIndex(idx,progress.cards);ui.cardCount=[...idx.cards.values()].reduce((n,c)=>n+c.printings.length,0);if(progress.complete)ui.completeData=true;ui.lastSync=progress.date;ui.connection=progress.cached?'cached':progress.complete?'online':'loading';render();}});if(result?.cards?.length){ui.syncMessage=result.persisted===false?'Card data loaded, but browser caching is unavailable.':'Card metadata is cached on this device.';if(ui.import?.parsed)recalculateImport();}}catch(error){ui.connection=ui.completeData?'cached':ui.cardCount?'partial':'offline';ui.syncMessage=error.name==='AbortError'?'Scryfall timed out. Decklists and collection data are unaffected.':error.message;render();if(force)toast('Card sync could not finish. Your collection is unaffected.',true);}}
async function loadRulings(){const m=ui.modal;if(m?.kind!=='card'||m.rulesLoading)return;m.rulesLoading=true;m.rulesError='';renderModal();try{m.rulings=await scryfall.rulings(idx.cards.get(m.key));}catch(error){m.rulesError=error.name==='AbortError'?'The rulings request timed out. Try again.':error.message;}finally{m.rulesLoading=false;if(ui.modal===m)renderModal();}}
async function cacheAllArt(){if(!('caches'in window)||!navigator.serviceWorker?.controller){toast('Offline caching becomes available after the service worker activates. Reload this static-server edition once.',true);return;}if(ui.cacheProgress)return;const urls=[...new Set([...idx.cards.values()].flatMap(c=>c.printings.flatMap(p=>[p.image_uris?.normal,p.image_uris?.art_crop])).filter(u=>safeURL(u).startsWith('https://')))];if(!urls.length)return;artCancel=false;ui.cacheProgress={done:0,total:urls.length,failed:0};renderModal();let cursor=0;const cache=await caches.open('jumpstart-atlas-images-v1');async function worker(){while(cursor<urls.length&&!artCancel){const url=urls[cursor++];try{if(!await cache.match(url)){const response=await fetch(url,{signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error('Image unavailable');await cache.put(url,response);}}catch{ui.cacheProgress.failed++;}ui.cacheProgress.done++;if(ui.modal?.kind==='settings')renderModal();await new Promise(r=>setTimeout(r,220));}}await Promise.all([worker(),worker()]);const {done,failed}=ui.cacheProgress;ui.cacheProgress=null;if(ui.modal?.kind==='settings')renderModal();toast(`${artCancel?'Stopped':'Finished'}: ${done-failed} images cached${failed?', '+failed+' unavailable':''}.`,failed>0);}
function saveRecipe(event){event.preventDefault();const m=ui.modal;if(m?.kind!=='save')return;const form=event.target;if(!form.reportValidity())return;const name=form.elements.name.value.trim(),notes=form.elements.notes.value.trim(),favorite=form.elements.favorite.checked;if(!name){form.elements.name.setCustomValidity('Add a name for this play deck.');form.elements.name.reportValidity();return;}const old=m.id?collection.saved.find(s=>s.id===m.id):null;const pair=m.pair||old?.pair||ui.pair;if(pair.length!==2)return;const next=structuredClone(collection);const record={id:old?.id||globalThis.crypto?.randomUUID?.()||'deck-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,notes,favorite,pair:[...pair],createdAt:old?.createdAt||new Date().toISOString()};if(old)next.saved=next.saved.map(s=>s.id===old.id?record:s);else next.saved.push(record);if(saveCollection(next,old?'Play deck updated.':'Your combination is saved.')){closeModal(true);navigate('saved');}}

function hidePrintPreview(){const box=document.getElementById('card-hover-preview');if(!box)return;box.classList.remove('show');box.hidden=true;box.innerHTML='';box.style.left='';box.style.top='';document.querySelectorAll('.printing-item[aria-expanded="true"]').forEach(el=>el.setAttribute('aria-expanded','false'));}
function placePrintPreview(event){const box=document.getElementById('card-hover-preview');if(!box||box.hidden)return;const w=box.offsetWidth||220,h=box.offsetHeight||300;let x=(event.clientX??0)+14,y=(event.clientY??0)+14;if(x+w>window.innerWidth-8)x=(event.clientX??0)-w-14;if(y+h>window.innerHeight-8)y=(event.clientY??0)-h-14;box.style.left=Math.max(8,x)+'px';box.style.top=Math.max(8,y)+'px';}
function showPrintPreview(button,event){const url=safeURL(button.dataset.hoverImage||'');const box=document.getElementById('card-hover-preview');if(!box||!url)return;hidePrintPreview();button.setAttribute('aria-expanded','true');box.innerHTML=`<img src="${e(url)}" alt="">`;box.hidden=false;box.classList.add('show');placePrintPreview(event||{clientX:button.getBoundingClientRect().right,clientY:button.getBoundingClientRect().top});}
function togglePrintPreview(button,event){const coarse=window.matchMedia('(hover: none)').matches||event?.pointerType==='touch';if(!coarse&&event?.pointerType==='mouse')return;event?.stopPropagation();const box=document.getElementById('card-hover-preview');const open=box&&!box.hidden&&button.getAttribute('aria-expanded')==='true';if(open)hidePrintPreview();else showPrintPreview(button,event);}
document.addEventListener('click',event=>{if(Date.now()<suppressClickUntil){event.preventDefault();return;}if(event.target.classList.contains('dialog-backdrop')){closeModal();return;}const button=event.target.closest('[data-action]');if(!button&&!event.target.closest('button,a,input,select,textarea,summary,[popover]')&&isCompact()){const recipe=event.target.closest('.pair-card[data-recipe]'),pack=event.target.closest('[data-pack-id]');if(recipe){showPlayDeck(recipe.dataset.recipe.split(','),recipe.dataset.savedId||null,recipe);return;}if(pack){showPack(pack.dataset.packId,pack);return;}}if(!button||button.disabled)return;event.preventDefault();if(button.closest('.action-popover'))closePopovers();Promise.resolve(handleAction(button,event)).catch(error=>{console.error(error);toast(error.message||'That action could not finish.',true);});});

document.addEventListener('change',event=>{const el=event.target,id=el.id;try{
 if(el.dataset.draftContext){const context=el.dataset.draftContext,selected=context==='library'?ui.cardFilters.draftTags:ui.draftFilters[context];if(el.checked){if(!selected.includes(el.value))selected.push(el.value);}else{const i=selected.indexOf(el.value);if(i>=0)selected.splice(i,1);}ui.cardPage=1;ui.inventoryPage=1;if(context==='pack'||context==='play')renderModal();else render();return;}
 if(id==='csv-file'){readCSVFile(el.files[0]);return;}if(id==='restore-file'){restoreFile(el.files[0]);return;}
 if(el.dataset.map){ui.import.mapping[el.dataset.map]=Number(el.value);ui.import.skipIssues=false;recalculateImport();return;}
 if(id==='import-j25-only'){ui.import.j25Only=el.checked;ui.import.skipIssues=false;recalculateImport();return;}
 if(id==='confirm-groups'||id==='skip-issues'){ui.import[id==='confirm-groups'?'confirmGroups':'skipIssues']=el.checked;renderModal();return;}
 if(el.name==='import-mode'){ui.import.mode=el.value;renderModal();return;}
 if(id==='reset-pack-allocations'){ui.import.resetAllocations=el.checked;renderModal();return;}
 if(id==='membership-filter'){ui.modal.membershipFilter=el.value;renderModal();return;}
 if(id==='picker-type'||id==='picker-ownership'){ui.modal[id==='picker-type'?'packType':'ownership']=el.value;renderModal();return;}
 if(id==='dialog-printing'){ui.modal.printing=el.value;renderModal();return;}
 if(id==='saved-favorite'){ui.modal.draftFavorite=el.checked;return;}
 if(id==='include-basics'){const next=structuredClone(collection);next.settings.includeBasics=el.checked;if(!saveCollection(next,el.checked?'Basic lands are now required.':'Basic lands are now assumed available.'))el.checked=collection.settings.includeBasics;return;}
 if(id==='pack-type')ui.packType=el.value;else if(id==='collection-type'){ui.collectionType=el.value;ui.matchLimit=24;ui.inventoryPage=1;}else if(id==='inventory-filter'){ui.inventoryFilter=el.value;ui.inventoryPage=1;}else if(id==='card-pack-type'){ui.cardFilters.packType=el.value;ui.cardPage=1;}else if(id==='pair-type')ui.pairType=el.value;else if(id==='saved-type')ui.savedType=el.value;else if(id==='saved-filter')ui.savedFilter=el.value;else if(id==='pack-card-filter')ui.packCardFilter=el.value;else if(id==='play-card-filter')ui.playCardFilter=el.value;else if(id==='play-lands')ui.showLands=el.checked;else if(id==='pack-filter')ui.packFilter=el.value;else if(id==='pack-lands')ui.showLands=el.checked;else if(id==='match-filter'){ui.matchFilter=el.value;ui.matchLimit=24;}else if(id==='share-match-cards'){ui.shareMatchCards=el.checked;ui.matchLimit=24;}
 else if(id==='search-owned')ui.cardFilters.owned=el.value;else if(id==='adv-color-cmp'){ui.cardFilters.colorCmp=el.value;applyAdvancedQuery();}else if(id==='adv-stat'){ui.cardFilters.stat=el.value;applyAdvancedQuery();}else if(id==='adv-stat-op'){ui.cardFilters.statOp=el.value;applyAdvancedQuery();}else if(id==='adv-format-status'){ui.cardFilters.formatStatus=el.value;applyAdvancedQuery();}else if(id==='adv-format'){ui.cardFilters.format=el.value;applyAdvancedQuery();}else if(id==='adv-price'){ui.cardFilters.price=el.value;applyAdvancedQuery();}else if(id==='adv-price-op'){ui.cardFilters.priceOp=el.value;applyAdvancedQuery();}
 else if(id==='hide-lands')ui.cardFilters.hideLands=el.checked;else if(id==='card-printings')ui.showPrintings=el.checked;else if(id==='card-sort')ui.cardSort=el.value;
 else if(id==='pair-color')ui.pairColor=el.value;else if(id==='pair-availability')ui.pairAvailability=el.value;else if(id==='identical-pairs')ui.includeIdentical=el.checked;else return;
 if(id.startsWith('search-')||id.startsWith('adv-')||['hide-lands','card-printings','card-sort'].includes(id))ui.cardPage=1;if(id.startsWith('pair-')||id==='identical-pairs')ui.pairPage=1;render();
 }catch(error){toast(error.message,true);}});
document.addEventListener('dragover',event=>{const drop=event.target.closest('#csv-drop');if(drop){event.preventDefault();drop.classList.add('dragover');}});
document.addEventListener('dragleave',event=>{event.target.closest('#csv-drop')?.classList.remove('dragover');});
document.addEventListener('drop',event=>{const drop=event.target.closest('#csv-drop');if(drop){event.preventDefault();drop.classList.remove('dragover');readCSVFile(event.dataTransfer.files[0]);}});
document.addEventListener('keydown',event=>{const el=document.activeElement,editing=el?.matches('input,textarea,select,[contenteditable="true"]');
 if(event.key==='Escape'&&document.querySelector('[popover]:popover-open'))return;
 if(event.key==='Escape'){if(ui.modal)closeModal();else if(ui.mobileOpen){ui.mobileOpen=false;render();document.querySelector('[data-action=menu]')?.focus();}else if(ui.expanded){ui.expanded=null;updateURL(true);render();}return;}
 if(event.key==='Tab'&&(ui.mobileOpen||document.querySelector('[popover]:popover-open'))){const scope=document.querySelector('[popover]:popover-open')||document.getElementById('atlas-sidebar');const els=[...scope.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea,[tabindex="0"]')].filter(x=>x.getClientRects().length);const first=els[0],last=els.at(-1);if(event.shiftKey&&(el===first||!scope.contains(el))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&(el===last||!scope.contains(el))){event.preventDefault();first?.focus();}return;}
 if(document.querySelector('[popover]:popover-open'))return;
 if(ui.modal&&event.key==='Tab'){const els=[...modalRoot.querySelectorAll('button:not(:disabled),a[href],input:not([hidden]):not(:disabled),select:not(:disabled),textarea,[tabindex="0"]')].filter(x=>x.getClientRects().length);const first=els[0],last=els.at(-1);if(!els.length){event.preventDefault();return;}if(event.shiftKey&&(el===first||el===modalRoot.querySelector('.dialog'))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(el===last||el===modalRoot.querySelector('.dialog'))){event.preventDefault();first.focus();}return;}
 if(el?.id==='csv-drop'&&(event.key==='Enter'||event.key===' ')){event.preventDefault();document.getElementById('csv-file')?.click();return;}
 if(event.key==='/'&&!editing&&!ui.modal){event.preventDefault();navigate('cards');document.getElementById('card-search')?.focus();return;}
 if(el?.matches('[role=tab][data-action=variant]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){const tabs=[...el.closest('[role=tablist]').querySelectorAll('[role=tab]')],i=tabs.indexOf(el),n=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;event.preventDefault();tabs[n].click();document.getElementById(tabs[n].id)?.focus();return;}
 if(!editing&&ui.modal?.navigation&&['ArrowLeft','ArrowRight'].includes(event.key)&&!el?.closest('[role=tablist]')){event.preventDefault();stepDialog(event.key==='ArrowLeft'?-1:1);return;}
 if(editing||ui.modal)return;const pack=el?.closest('.pack');if(pack&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
  event.preventDefault();const lane=pack.closest('.lane'),packs=[...lane.querySelectorAll('.pack')],position=packs.indexOf(pack);let target;
  if(event.key==='ArrowLeft'||event.key==='ArrowRight')target=packs[Math.max(0,Math.min(packs.length-1,position+(event.key==='ArrowLeft'?-1:1)))];
  else {const lanes=[...root.querySelectorAll('.lane')],ln=lanes[lanes.indexOf(lane)+(event.key==='ArrowUp'?-1:1)];if(ln){const pp=[...ln.querySelectorAll('.pack')];target=pp[Math.min(position,pp.length-1)];}}
  target?.querySelector('.pack-main')?.focus({preventScroll:true});target?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
 }
});
document.addEventListener('pointerover',event=>{const button=event.target.closest('[data-hover-image]');if(!button||window.matchMedia('(hover: none)').matches)return;showPrintPreview(button,event);});
document.addEventListener('pointermove',event=>{if(event.target.closest('[data-hover-image]')||document.getElementById('card-hover-preview')?.classList.contains('show'))placePrintPreview(event);});
document.addEventListener('pointerout',event=>{if(window.matchMedia('(hover: none)').matches)return;const button=event.target.closest('[data-hover-image]');if(button&&!button.contains(event.relatedTarget))hidePrintPreview();});
window.addEventListener('popstate',()=>{closeModal(true);readRoute();render();if(ui.view==='cards')scheduleLibrarySearch();});
window.addEventListener('hashchange',()=>{closeModal(true);readRoute();render();if(ui.view==='cards')scheduleLibrarySearch();});
window.addEventListener('storage',event=>{if(event.key!==STORAGE_KEY)return;try{collection=event.newValue?validateBackup(JSON.parse(event.newValue),idx):emptyCollection();ui.undo=null;render();toast('Atlas updated from another browser tab.');}catch{recoveryRaw=event.newValue;storageError='Another tab wrote unreadable data. Export recovery data in Settings before making changes.';render();toast(storageError,true);}});
window.addEventListener('pagehide',()=>{artCancel=true;});
readRoute();render();if(ui.expanded?.id)showPack(ui.expanded.id);if(ui.view==='cards')scheduleLibrarySearch();
if('serviceWorker'in navigator&&!window.JSATLAS_STANDALONE&&['http:','https:'].includes(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
syncCards();


})();

</script>
</body>
