.synergy-mix strong{font-size:12px;line-height:1.35}
.synergy-mix .synergy-tags{display:flex;flex-wrap:wrap;gap:4px}
.synergy-tag{font-size:9px;letter-spacing:.02em;padding:2px 6px;border-radius:4px;background:#2b2433;color:#cbb7e0;border:1px solid #4a3b5c}
.synergy-meter{height:4px;border-radius:4px;background:#302c39;overflow:hidden}
.synergy-meter i{display:block;height:100%;background:linear-gradient(90deg,#7d6aa0,#d4b15c)}
.pair-card.saved-mix{border-color:#b89a55;box-shadow:inset 0 0 0 1px #b89a5533}
.pair-card .synergy-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.pair-filter-note{font-size:11px;color:#c7b2dd;margin:0 0 12px}
.copy-row{display:inline-flex;align-items:center;gap:8px}
.card-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
@media(max-width:600px){
  .synergy-rail{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  #card-hover-preview{width:min(220px,62vw)}
}
@media not print {
  .dialog-backdrop{align-items:flex-start;padding-block:8dvh}
  .dialog{max-height:calc(100dvh - 16dvh);overflow-y:auto}
}
@media print {
  .dialog-backdrop{padding:0;padding-block:0}
  .dialog{max-height:none;overflow:visible}
}
</style>

/** One paginated set query, cached locally. Images use returned CDN image_uris. */
class ScryfallService {
  constructor(){this.queue=Promise.resolve();this.lastRequest=0;this.dbPromise=null;this.busy=false;}
  async db(){
    if(typeof indexedDB==='undefined')return null;
    if(!this.dbPromise)this.dbPromise=new Promise(resolve=>{
      const request=indexedDB.open('jumpstart-atlas-data',1);
      const timer=setTimeout(()=>resolve(null),1800);
      request.onupgradeneeded=()=>request.result.createObjectStore('cache');
      request.onsuccess=()=>{clearTimeout(timer);resolve(request.result);};
      request.onerror=request.onblocked=()=>{clearTimeout(timer);resolve(null);};
    });
    return this.dbPromise;
  }
  async readCache(key){
    try{const db=await this.db();if(!db)return null;return await new Promise(resolve=>{const r=db.transaction('cache').objectStore('cache').get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null);});}catch{return null;}
  }
  async writeCache(key,value){
    try{const db=await this.db();if(!db)return false;return await new Promise(resolve=>{const t=db.transaction('cache','readwrite');t.objectStore('cache').put(value,key);t.oncomplete=()=>resolve(true);t.onerror=()=>resolve(false);});}catch{return false;}

  request(url,{allowEmpty=false}={}){
    const task=async()=>{
      for(let attempt=0;attempt<3;attempt++){
        await new Promise(r=>setTimeout(r,Math.max(0,200-(Date.now()-this.lastRequest))));
        const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);
        try{

          if(response.status===429||response.status>=500){
            if(attempt===2)throw new Error(`Scryfall is temporarily unavailable (${response.status}). Try again later.`);
            const wait=Math.min(60,Number(response.headers.get('Retry-After'))||2**(attempt+1))*1000;
            clearTimeout(timeout);await new Promise(r=>setTimeout(r,wait));continue;
          }
          if(response.status===404){
            const data=await response.json().catch(()=>null);
            if(allowEmpty&&data?.code==='not_found')return {object:'list',total_cards:0,data:[],has_more:false};
            throw new Error(data?.details||'Scryfall returned 404.');
          }
          if(!response.ok)throw new Error(`Scryfall returned ${response.status}. Your collection is unaffected.`);
          return await response.json();
        }finally{clearTimeout(timeout);}
      }
    };

  }
  async search(query){
    const hits=new Set();
    let url='https://api.scryfall.com/cards/search?unique=cards&q='+encodeURIComponent(query);
    while(url){
      if(!String(url).startsWith('https://api.scryfall.com/'))throw new Error('Unexpected search host.');
      const data=await this.request(url,{allowEmpty:true});
      if(!data||data.object==='error'){
        if(data?.code==='not_found')return hits;
        throw new Error(data?.details||'Scryfall search failed.');
      }
      for(const c of data.data||[]){
        if(c.id)hits.add(c.id);
        if(c.oracle_id)hits.add(c.oracle_id);

      }

    }

  }
  async load({force=false,onProgress=()=>{}}={}){
    const cache=await this.readCache('j25');

    if(this.busy)return cache;

  }
}

function isPairConfirmed(pair){const req={};for(const id of pair)req[id]=(req[id]||0)+1;return pair.length===2&&Object.entries(req).every(([id,n])=>(collection.allocations[id]||0)>=n);}
function pairTitle(pair){return pair.map(id=>{const d=idx.decks.get(id);return d?`${d.name} v${d.variant}`:'Choose a pack';}).join(' + ');}
function filteredPairs(){const words=normalizeName(ui.pairQuery).split(/\s+/).filter(Boolean);const selected=ui.pair.filter(Boolean);
  return PAIRS.filter(pair=>{
  if(!ui.includeIdentical&&pair[0]===pair[1])return false;const ds=pair.map(id=>idx.decks.get(id)),cols=[...new Set(ds.map(d=>d.color))];
  if(ui.pairColor==='mono'&&(cols.length!==1||cols[0]==='M'))return false;if(ui.pairColor==='two'&&(cols.length!==2||cols.includes('M')))return false;
  if(['W','U','B','R','G','M'].includes(ui.pairColor)&&!cols.includes(ui.pairColor))return false;
  if(words.length&&!words.every(w=>normalizeName(ds.map(d=>d.name+' v'+d.variant+' '+idx.themes.get(d.themeId).tags.join(' ')).join(' ')).includes(w)))return false;
  if(!ds.some(d=>themeMatchesType(idx.themes.get(d.themeId),ui.pairType)))return false;
  if(ui.pairAvailability==='confirmed'&&!isPairConfirmed(pair))return false;
  if(ui.pairAvailability==='unowned'&&isPairConfirmed(pair))return false;
  if(ui.pairAvailability==='missing'&&coverageForPair(pair).complete)return false;
  if(ui.pairAvailability==='buildable'&&!coverageForPair(pair).complete)return false;
  if(selected.length&&!selected.every(id=>pair.includes(id)))return false;
  return true;

function dialogNavHTML(m=ui.modal) {

function navigationFor(items, target, label, key) {
  const unique=[...new Map(items.map(item=>[key(item),item])).values()];
  let index=unique.findIndex(item=>key(item)===key(target));
  if(index<0){unique.push(target);index=unique.length-1;}
  return {items:unique,index,label};
}
function explorePackItems(){return Object.keys(CATALOG.colors).flatMap(color=>filteredThemes().filter(t=>t.color===color).flatMap(t=>visibleThemeVariants(t).map(id=>({id}))));}
function packNavigation(id,button=null){
  const context=button?.closest('[data-pack-context]')?.dataset.packContext;
  let items;
  if(context==='matches')items=filteredCandidates().map(c=>({id:c.deck.id}));
  else if(context==='confirmed')items=filteredConfirmed().map(([id])=>({id}));
  else if(context==='membership')items=[...button.closest('[data-pack-context]').querySelectorAll('[data-action="reveal-pack"]')].map(b=>({id:b.dataset.id}));
  else if(ui.modal?.kind==='compare')items=idx.themes.get(ui.modal.theme).variants.map(id=>({id}));
  else if(ui.modal?.kind==='play-deck')items=ui.modal.pair.map(id=>({id}));
  else items=explorePackItems();
  return navigationFor(items,{id},'pack versions',x=>x.id);
}

function dialogFrame(title,body,footer='',size=''){return `<div class="dialog-backdrop"><section class="dialog ${size}" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><header class="dialog-header"><div class="dialog-heading"><h2 id="dialog-title">${e(title)}</h2>${dialogNavHTML()}</div><div class="dialog-close-actions">${ui.modalStack.length?`<button class="text-button dialog-back" data-action="close-modal">${icon('left')}Back</button>`:''}<button class="icon-button ghost" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button></div></header><div class="dialog-content">${body}</div>${footer?`<footer class="dialog-footer">${footer}</footer>`:''}</section></div>`;}

function savedMembershipHTML(card){const matches=collection.saved.filter(s=>s.pair.some(id=>idx.decks.get(id).cards.some(c=>normalizeName(c.name)===card.key)));if(!matches.length)return '';return `<div class="membership-heading"><h3>In your saved play decks</h3><span class="faint">${matches.length} recipes</span></div><div class="membership-list">${matches.slice(0,12).map(s=>`<button data-action="load-saved" data-id="${e(s.id)}"><span><strong>${e(s.name)}</strong><small class="faint"> · ${requirements(s.pair.map(id=>idx.decks.get(id)),true)[card.key]} copies</small></span>${icon('arrow')}</button>`).join('')}</div>${matches.length>12?'<p class="form-hint">Showing the first 12 matching saved recipes.</p>':''}`;}
function cardDialogHTML(m){const c=idx.cards.get(m.key);if(!c)return dialogFrame('Card not found','<p>This card is not in the J25 catalog.</p>');const members=c.decks.filter(id=>matchesPackOwnership(derived.status.get(id),m.membershipFilter||'all'));const p=c.printings.find(p=>p.id===m.printing)||c.printings[0];const rules=p?.oracle_text||c.oracle;const type=p?.type_line||c.type;const oracleParts=rules?rules.split('\n').map(x=>`<p>${e(x)}</p>`).join(''):'';return dialogFrame(c.name,`<div class="card-dialog-layout"><div class="card-dialog-picture">${cardPicture(c,0,{button:false,eager:true,printing:p})}${c.printings.length>1?`<label class="form-field printings">J25 printing<select class="input" id="dialog-printing">${c.printings.map(pr=>`<option value="${e(pr.id)}" ${pr.id===p?.id?'selected':''}>#${e(pr.collector_number)} · ${e(pr.artist||'Unknown artist')}</option>`).join('')}</select><small>Ownership combines equivalent printings.</small></label>`:''}</div><div><div class="card-detail-heading"><div><div class="eyebrow">FOUNDATIONS JUMPSTART · ${p?'#'+e(p.collector_number):'J25'}</div><h3>${e(c.name)}</h3></div>${manaCost(p?.mana_cost||c.manaCost||'')}</div><p class="card-type">${e(type||(c.isLand?'Land':'Card metadata not loaded'))}</p>${c.metadata?`<div class="oracle-text">${oracleParts}</div>${p?.flavor_text||c.flavor?`<p class="flavor-text">${e(p?.flavor_text||c.flavor)}</p>`:''}<div class="card-info-grid"><div><span>Rarity</span><strong>${e(p?.rarity||c.rarity)}</strong></div><div><span>Mana value</span><strong>${p?.cmc??c.manaValue??'—'}</strong></div><div><span>Color identity</span><strong>${(p?.color_identity||c.identity||[]).length?(p?.color_identity||c.identity).map(x=>mana(x)).join(''):'Colorless'}</strong></div><div><span>${p?.power!=null?'Power / toughness':'Illustration'}</span><strong>${p?.power!=null?e(p.power)+' / '+e(p.toughness):e(p?.artist||c.artist||'—')}</strong></div></div>`:`<div class="notice warning">Rules text, mana, and printing details need a connection to Scryfall. Your pack lists and collection are still available.<button class="text-button" data-action="sync">${icon('refresh')}Load card data</button></div>`}<div class="card-collection-control"><div><strong>In your collection</strong><small>${collection.inventory[c.key]||0} copies · ${derived.reserved[c.key]||0} allocated to confirmed packs${c.isBasic&&!collection.settings.includeBasics?' · basic lands not required':''}</small></div>${quantityHTML(c.key)}</div><div class="membership-heading"><h3>Matched J25 printings</h3><span class="faint">${(c.printings.length||1)} in this set</span></div><ul class="printing-list">${(c.printings.length?c.printings:[{set:'j25',collector_number:c.number,rarity:c.rarity,artist:c.artist,image_uris:c.images}]).map(pr=>{const img=safeURL(pr.image_uris?.normal||pr.images?.normal||imageSource(c,'normal',pr).url);const set=(pr.set||'j25').toUpperCase();return `<li><button type="button" class="printing-item" data-action="preview-print" data-hover-image="${e(img)}" aria-expanded="false" aria-label="${e(c.name)} ${set} printing ${pr.collector_number||''}">${setGlyph(pr.set,set)}<span><strong>${set}</strong><small>#${e(pr.collector_number||'—')} · ${e(pr.rarity||'unknown rarity')}${pr.artist?' · '+e(pr.artist):''}</small></span></button></li>`;}).join('')}</ul><p class="form-hint">Copies are counted by English name. Hover a set icon to see that printing; tap to pin it on a touch screen.</p><div class="membership-heading"><h3>Find it in a pack</h3><span class="faint">${members.length} of ${c.decks.length} variants</span></div><select id="membership-filter" class="filter-select" aria-label="Filter packs containing this card">${selectOptions([['all','All containing packs'],['unowned','Unowned versions'],['owned','Confirmed versions'],['buildable','Buildable versions']],m.membershipFilter||'all')}</select><div class="membership-list" data-pack-context="membership">${members.length?members.map(id=>{const d=idx.decks.get(id),q=d.cards.find(x=>normalizeName(x.name)===c.key).quantity;return `<button data-action="reveal-pack" data-id="${id}"><span class="row gap-sm">${mana(d.color)}<strong>${e(d.name)}</strong><span class="faint">v${d.variant} · ${q}×</span></span>${deckBadge(d)}${icon('right')}</button>`;}).join(''):'<p class="muted">No containing pack versions match this filter.</p>'}</div>${savedMembershipHTML(c)}<div class="card-links"><a class="text-button" href="${e(safeURL(p?.scryfall_uri||c.scryfallUrl)||'https://scryfall.com/search?q='+encodeURIComponent('set:j25 !"'+c.name+'"'))}" target="_blank" rel="noopener noreferrer">View on Scryfall ${icon('external')}</a><a class="text-button" href="${e(ligaMagicURL(c.name))}" target="_blank" rel="noopener noreferrer">View on LigaMagic ${icon('external')}</a><button class="text-button" data-action="rulings" ${!c.id||m.rulesLoading?'disabled':''}>${icon('info')}${m.rulesLoading?'Loading rulings…':'Official rulings'}</button></div>${m.rulesError?`<p class="notice warning">${e(m.rulesError)}</p>`:''}${m.rulings?`<div class="rulings"><h3>Card rulings</h3>${m.rulings.length?m.rulings.map(r=>`<div><small class="mono faint">${e(r.published_at)}</small><p>${e(r.comment)}</p></div>`).join(''):'<p class="muted">No rulings returned for this card.</p>'}</div>`:''}</div></div>`,'','wide');}
function columnMappingHTML(m){const labels={name:'Card name',quantity:'Quantity',set:'Set / edition',number:'Collector number',id:'Scryfall ID',group:'Pack / container (optional)',groupType:'Container type (optional)'};return `<div class="column-mapping">${Object.entries(labels).map(([key,label])=>`<label class="form-field">${label}<select class="input" data-map="${key}" aria-label="Map ${label}"><option value="-1">${key==='quantity'?'No column · assume 1':'Not mapped'}</option>${m.parsed.headers.map((h,i)=>`<option value="${i}" ${m.mapping[key]===i?'selected':''}>${e(h||'Column '+(i+1))}</option>`).join('')}</select></label>`).join('')}</div>`;}
function importDialogHTML(){const m=ui.import||{};let body='';let foot='';if(!m.parsed){body=`<div class="import-step"><span>01</span>Bring your cards along</div><label class="import-drop" id="csv-drop" tabindex="0" role="button" aria-label="Choose a collection CSV file"><input id="csv-file" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values" hidden>${icon('upload')}<strong>Drop your CSV here</strong><span>or click to choose a file</span><small>CSV or TSV · up to 10 MB · 50,000 rows</small></label>${m.error?`<p class="notice warning" role="alert">${e(m.error)}</p>`:''}<div class="import-info"><p><strong>Mythic Tools CSV exports</strong> are supported, including Card Name, Quantity, Set Code, Collector Number, Scryfall ID, and container columns. A simple <strong>Name</strong> / <strong>Quantity</strong> file also works. We also recognize common set, collector-number, and Scryfall-ID columns. Column mapping is adjustable before import. Foil, condition, price, and finish rows are combined by card name, not discarded.</p><p>An optional <strong>Pack</strong> column can identify separate physical boosters. Ambiguous or incomplete groups are never silently confirmed.</p></div><div class="notice subtle">${icon('lock')}Your CSV stays in this browser. It is parsed locally, never uploaded to a server.</div><div class="row between wrap"><button class="text-button" data-action="csv-template">${icon('download')}Download a CSV template</button><button class="text-button" data-action="sample-import">Preview an example collection ${icon('arrow')}</button></div>`;foot='<button class="btn btn-secondary" data-action="close-modal">Cancel</button>';}
 else {const r=m.result;const allocationConflict=r&&m.mode==='replace'?coverage(derived.reserved,r.inventory).missingCount:0;body=`<div class="import-step"><span>02</span>Check your matches before importing</div><div class="file-summary">${icon('file')}<div><strong>${e(m.fileName)}</strong><small>${e(detectCSVFormat(m.parsed.headers))} · ${m.parsed.rows.length.toLocaleString()} source rows · ${m.parsed.delimiter==='\t'?'tab':m.parsed.delimiter===';'?'semicolon':'comma'} separated${m.demo?' · EXAMPLE DATA, not your actual collection':''}</small></div><button class="text-button" data-action="restart-import">Choose another file</button></div><details class="native-details" ${m.error?'open':''}><summary>Review column mapping</summary>${columnMappingHTML(m)}</details><label class="toggle-label" style="margin:16px 0"><input id="import-j25-only" type="checkbox" ${m.j25Only?'checked':''}>Only accept rows explicitly marked J25, or with a blank set</label>${m.error?`<p class="notice warning" role="alert">${e(m.error)}</p>`:''}${r?`<div class="import-summary"><div><strong>${r.total.toLocaleString()}</strong><span>Card copies</span></div><div><strong>${r.distinct}</strong><span>Unique names</span></div><div><strong>${r.acceptedRows}</strong><span>Accepted rows</span></div><div><strong>${r.issues.length}</strong><span>Rows to review</span></div></div><p class="form-hint">Matches are by card name, across interchangeable printings. Quantities add together. ${collection.settings.includeBasics?'Basic land quantities are required.':'Basic lands are assumed available when matching packs.'} Collector numbers and Scryfall IDs require loaded card data.</p><div class="import-mode"><label><input type="radio" name="import-mode" value="replace" ${m.mode==='replace'?'checked':''}><span><strong>Replace card inventory</strong><small>Replaces quantities while keeping confirmed pack assignments. Saved recipes and stars remain.</small></span></label><label><input type="radio" name="import-mode" value="add" ${m.mode==='add'?'checked':''}><span><strong>Add these card copies</strong><small>Adds to existing quantities. Importing the same file twice will double its cards.</small></span></label></div>${m.mode==='replace'&&derived.owned?`<div class="notice ${allocationConflict&&!m.resetAllocations?'warning':'subtle'}"><div><strong>Keep your exact confirmed versions</strong><p>${allocationConflict?`${allocationConflict} reserved card copies are absent from this replacement. Add the missing copies to the CSV, use Add mode, or explicitly release your pack assignments below.`:'All confirmed pack assignments fit this replacement and will be retained.'}</p><label class="toggle-label"><input id="reset-pack-allocations" type="checkbox" ${m.resetAllocations?'checked':''}>Release all ${derived.owned} confirmed packs and re-match from scratch</label></div></div>`:''}${r.groupMatches.length?`<div class="results-bar"><h3>Pack / container groups</h3>${layoutToggle('importGroups','Imported group layout')}</div><p class="form-hint">A binder, deck, or container is not automatically a physical booster. Confirm only groups you know represent separate, complete 20-card packs.</p><div class="import-preview-matches layout-${ui.layouts.importGroups}" data-shelf="import-groups">${r.groupMatches.slice(0,12).map(g=>`<div class="row between"><span>${e(g.name)}</span><span>${g.exact.length===1?`${e(idx.decks.get(g.exact[0]).name)} v${idx.decks.get(g.exact[0]).variant} ${badgeHTML('complete','Exact list')}`:g.exact.length>1?badgeHTML('partial',`${g.exact.length} possible versions`):badgeHTML('neutral','Incomplete / no exact match')}</span></div>`).join('')}${r.groupMatches.length>12?`<p class="faint">+ ${r.groupMatches.length-12} more groups</p>`:''}</div>${r.groupMatches.some(g=>g.exact.length===1)?`<label class="toggle-label" style="margin:16px 0"><input id="confirm-groups" type="checkbox" ${m.confirmGroups?'checked':''}>I confirm the ${r.groupMatches.filter(g=>g.exact.length===1).length} uniquely matched groups represent separate packs I own.</label>`:''}`:`<div class="notice subtle">${icon('info')}Without a Pack column, we show ranked variant candidates after import. You decide which packs to confirm; shared cards will not be counted twice.</div>`}${r.issues.length?`<details class="native-details" open><summary>${r.issues.length} rows will be excluded</summary><div class="issues-table">${r.issues.slice(0,25).map(issue=>`<div class="issue-row"><span class="mono faint">Row ${issue.row}</span><strong>${e(issue.name||'Unnamed')}</strong><span>${e(issue.message)}</span></div>`).join('')}</div>${r.issues.length>25?`<p class="muted">Showing the first 25 issues.</p>`:''}<button class="text-button" data-action="export-issues">${icon('download')}Download full issue report</button></details><label class="toggle-label" style="margin-top:16px"><input id="skip-issues" type="checkbox" ${m.skipIssues?'checked':''}>I reviewed the exclusions. Import only the accepted rows.</label>`:''}`:''}`;foot=`<button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="apply-import" ${!r||!r.total||r.issues.length&&!m.skipIssues||allocationConflict>0&&!m.resetAllocations?'disabled':''}>${icon('check')}${m.demo?'Import example data':m.mode==='add'?'Add to collection':'Replace inventory'}</button>`;}
 return dialogFrame('Import your collection',body,foot,'wide');}
function compareDialogHTML(m){const t=idx.themes.get(m.theme),ds=t.variants.map(id=>idx.decks.get(id)),maps=ds.map(d=>requirements([d],true));const keys=[...new Set(ds.flatMap(d=>d.cards.filter(c=>!c.isLand).map(c=>normalizeName(c.name))))];const common=keys.filter(k=>maps.every(x=>(x[k]||0)>0));const differences=keys.filter(k=>!maps.every(x=>x[k]===maps[0][k]));return dialogFrame(`${t.name} · compare versions`,`<p class="muted">Compare nonland cards across published variants. Shared cards establish the theme; the differences help identify the exact version.</p><div class="notice subtle"><div><strong>${common.length} shared nonland names</strong><p>${common.map(k=>`<button class="text-button" data-action="card" data-key="${e(k)}">${e(idx.cards.get(k).name)}</button>`).join(' · ')}</p></div></div><div class="comparison-scroll"><table class="comparison-table"><thead><tr><th>Different cards</th>${ds.map(d=>`<th><button class="text-button" data-action="reveal-pack" data-id="${d.id}">Version ${d.variant}</button></th>`).join('')}</tr></thead><tbody>${differences.map(k=>`<tr><td><button class="text-button" data-action="card" data-key="${e(k)}">${e(idx.cards.get(k).name)}</button></td>${maps.map(x=>`<td class="mono">${x[k]||'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="form-hint">All variants contain 20 cards. Land differences are visible in each expanded pack with “Show lands.”</p>`,'','wide');}
function saveDialogHTML(m){const saved=m.id?collection.saved.find(s=>s.id===m.id):null;const pair=m.pair||saved?.pair||ui.pair;if(pair.length!==2)return dialogFrame('Choose two packs first','<p>Open the mixing room to finish your pairing.</p>');return dialogFrame(saved?'Edit your play deck':'Keep this combination',`<div class="selected-packs-title">${pair.map(id=>{const d=idx.decks.get(id);return `<span>${mana(d.color)}${e(d.name)} <small>v${d.variant}</small></span>`;}).join('<span>＋</span>')}</div><form id="save-deck-form" class="form-stack"><label class="form-field">Deck name<input id="saved-name" class="input" name="name" maxlength="120" required value="${e(m.draftName??saved?.name??pairTitle(pair))}" placeholder="A memorable name for a magical mix"></label><label class="form-field">Notes<textarea id="saved-notes" name="notes" class="input" rows="4" maxlength="2000" placeholder="Favorite plays, friends you played with, or a little strategy…">${e(m.draftNotes??saved?.notes??'')}</textarea></label><label class="toggle-label"><input type="checkbox" id="saved-favorite" name="favorite" ${m.draftFavorite??saved?.favorite?'checked':''}>Star this deck</label><p class="form-hint">A saved recipe does not change your inventory or reserve extra cards. Wish-list combinations are welcome.</p></form>`,`<button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="save-deck-form">${icon('bookmark')}${saved?'Save changes':'Save play deck'}</button>`,'small');}
function pickerHTML(m){const decks=CATALOG.decks.filter(d=>normalizeName(d.name+' v'+d.variant+' '+idx.themes.get(d.themeId).tags.join(' ')).includes(normalizeName(m.query||''))&&themeMatchesType(idx.themes.get(d.themeId),m.packType||'')&&matchesPackOwnership(derived.status.get(d.id),m.ownership||'all'));return dialogFrame(`Choose pack ${(m.slot||0)+1}`,`<div class="search-box">${icon('search')}<input id="picker-search" type="search" placeholder="Find a theme or version…" value="${e(m.query||'')}" aria-label="Search pack variants"></div><div class="results-bar">${typeSelect('picker-type',m.packType||'')}<select id="picker-ownership" class="filter-select" aria-label="Filter picker ownership">${selectOptions([['all','All pack versions'],['owned','Confirmed versions'],['unowned','Unowned versions'],['buildable','Buildable from loose cards']],m.ownership||'all')}</select><span class="faint">${decks.length} versions</span></div><div class="membership-list picker-list">${decks.map(d=>`<button data-action="pick-pack" data-id="${d.id}" data-slot="${m.slot||0}"><span class="row gap-sm">${mana(d.color)}<strong>${e(d.name)}</strong>${rarityMark(idx.themes.get(d.themeId))}<span class="faint">v${d.variant}</span></span>${deckBadge(d)}${icon('plus')}</button>`).join('')||'<p class="muted">No matching variants.</p>'}</div>`,'','small');}

function guideHTML(searchOnly=false){return dialogFrame(searchOnly?'Find exactly the card you need':'A little guidance, a lot of possibilities',searchOnly?`<p class="muted">The query box is <a href="https://scryfall.com/docs/syntax" target="_blank" rel="noopener noreferrer">Scryfall search syntax</a>. Advanced filters write those tokens for you. Results are Scryfall hits that also exist in the J25 catalog. <code>set:j25</code> is implied unless you specify a set.</p><div class="help-grid">${[['t:creature c:g mv<=3','Type, color, and mana value — the same operators as Scryfall.'],['o:"draw a card"','Oracle text. Use ~ as the card name.'],['c=wu','Exactly these colors. c:wu includes them; c<=wu is at most them.'],['id:esper t:instant','Commander identity. f:commander, banned:legacy, game:paper also work.'],['pow>=4 r:rare','Power, toughness, loyalty, rarity, artist, flavor, prices.'],['(t:angel or t:demon) o:flying','OR and parentheses are evaluated by Scryfall.'],['theme:angels','Atlas-only: cards in that Jumpstart theme.'],['is:owned -t:land','Atlas-only ownership. is:unowned and is:missing are the same local filter.']].map(([q,t])=>`<div><button class="query-chip" data-action="modal-query" data-query="${e(q)}">${e(q)}</button><p>${e(t)}</p></div>`).join('')}</div><p class="notice subtle">If Scryfall is unreachable, a smaller local matcher runs instead. Pack color is not substituted for a card’s actual color.</p>`:`<div class="guide-step"><span>01</span><div><h3>Find your theme</h3><p>Move down through colors and sideways through themes. Drag a shelf, use its arrows, or switch to a grid. Open a theme to inspect its exact versions in a dialog. Every card shelf can switch between Horizontal and Grid. Filter by unowned versions or a theme tag such as Flying, Tokens, or Lifegain. Lands stay tucked away until you need them.</p></div></div><div class="guide-step"><span>02</span><div><h3>Make the atlas yours</h3><p>Use Import collection in the sidebar to upload a CSV (including Mythic Tools-style exports), inspect variant matches, and confirm packs from available cards. A “Buildable” badge is not an ownership claim. “Add known pack” adds the actual 20 cards and confirms that exact pack; “Confirm from cards” only allocates existing copies.</p></div></div><div class="guide-step"><span>03</span><div><h3>Mix, play, repeat</h3><p>Add two pack variants to the mixing room. Check the combined 40-card list, see shortages, and save a named play deck. Pairings are unordered, and identical variants are allowed when you have enough copies. Cards reserved for another exact version are unavailable until you release that pack.</p></div></div><p class="notice subtle">Pack, card, and play-deck dialogs have Previous / Next controls for the list you opened. Arrow keys also navigate. Back returns to the parent dialog without losing its scroll position. Unowned cards have zero copies; unowned pack versions are those you have not confirmed.</p><div class="notice subtle">${icon('lock')}Your collection lives on this browser and device. Export a JSON backup to move it or protect it before clearing browser data. Import files never leave your browser.</div><div class="row wrap gap-sm"><span><kbd>/</kbd> Card search</span><span><kbd>← →</kbd> Across a shelf / Previous & next in dialogs</span><span><kbd>↑ ↓</kbd> Between color shelves</span><span><kbd>Esc</kbd> Close a dialog</span></div>`,`<button class="btn btn-primary" data-action="close-modal">${searchOnly?'Back to browsing':'Let’s explore'}${icon('arrow')}</button>`,'wide');}
function settingsHTML(about=false){const persistent=typeof navigator.serviceWorker!=='undefined'&&location.protocol!=='file:'&&!window.JSATLAS_STANDALONE;return dialogFrame(about?'About this atlas':'Settings & backups',`${!about?`<section class="settings-section"><h3>Collection matching</h3><label class="toggle-label"><input type="checkbox" id="include-basics" ${collection.settings.includeBasics?'checked':''}>Require basic land copies when checking ownership</label><p class="form-hint">Default: basic lands are assumed available. Nonbasic lands always count. Enabling this also checks your confirmed packs, so add their basic lands first.</p></section><section class="settings-section"><h3>Your data, in your hands</h3><p class="muted">Collection quantities, confirmed packs, starred themes, and saved recipes are stored in this browser. There is no cloud account or cross-device sync.</p><div class="row wrap gap-sm"><button class="btn btn-secondary" data-action="backup">${icon('download')}Export full backup</button><label class="btn btn-secondary" for="restore-file">${icon('upload')}Restore backup<input id="restore-file" type="file" accept=".json,application/json" hidden></label><button class="btn btn-secondary" data-action="copy-inventory">Copy card list</button></div>${recoveryRaw!==null?`<div class="notice warning"><div><p>Unreadable local data has not been overwritten. Export it for recovery, then reset or restore a valid backup.</p><button class="btn btn-secondary btn-small" data-action="recovery-export">Export unreadable data</button></div></div>`:''}<button class="text-button" style="color:var(--red);margin-top:18px" data-action="reset-data">${icon('trash')}Reset all local collection data</button></section><section class="settings-section"><h3>Card data & offline images</h3><p class="muted">The 121 decklists are bundled. Scryfall supplies card images, rules, mana, rarity, and printings in a paginated set sync, cached in IndexedDB for 24 hours.</p><div class="row between wrap"><span class="status-line"><i class="live-dot"></i>${ui.cardCount} loaded printings${ui.lastSync?' · '+e(new Date(ui.lastSync).toLocaleDateString()):''}</span><button class="btn btn-secondary btn-small" data-action="sync" ${ui.connection==='loading'?'disabled':''}>${icon('refresh')}Refresh card data</button></div>${ui.syncMessage?`<p class="form-hint">${e(ui.syncMessage)}</p>`:''}<p class="form-hint">${persistent?'The static-server edition caches viewed card images when its service worker is active. You may also cache all loaded J25 card images below. Browser storage can be evicted; downloaded assets in the source edition are the durable offline option.':'This single-file or file:// edition loads images from the CDN. For offline images, run the source edition and its download:images script.'}</p>${persistent?`<div class="row gap-sm"><button class="btn btn-secondary btn-small" data-action="cache-art" ${!ui.cardCount||ui.cacheProgress?'disabled':''}>${icon('download')}Cache all card images</button>${ui.cacheProgress?`<span class="muted">${ui.cacheProgress.done} / ${ui.cacheProgress.total}${ui.cacheProgress.failed?' · '+ui.cacheProgress.failed+' unavailable':''}</span><button class="text-button" data-action="cancel-cache">Cancel</button>`:''}</div>`:''}</section>`:''}<section class="settings-section"><div class="eyebrow">JUMPSTART ATLAS · 1.0</div><h3>46 themes. 121 variants. One connected collection.</h3><p class="muted">J25 decklists are transcribed from the published Foundations Jumpstart booster themes. Version numbers follow the order on that page; they are not printed pack identifiers. The 7,381 pairings include identical variants and count A + B only once.</p><p class="muted">Card ownership is combined by English card name, not exact printing, language, foil finish, or condition. A CSV can show what you can build, not prove which original sealed booster it came from. Suggested allocations are quantity-safe heuristics, not a unique or guaranteed optimal  if(m.kind==='suggest'){const result=m.result;const count=sumValues(result.suggested);return dialogFrame('One possible pack allocation',`<div class="notice warning">${icon('info')}This quantity-safe suggestion prioritizes distinctive complete matches. It is not proof of your original packs and is not guaranteed to be the only or maximum-pack solution.</div>${count?`<div class="membership-list">${Object.entries(result.suggested).map(([id,n])=>{const d=idx.decks.get(id);return `<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--border)"><span>${mana(d.color)} ${e(d.name)} v${d.variant}</span><strong class="mono">${n} pack${n===1?'':'s'}</strong></div>`;}).join('')}</div><p class="muted">${count} packs proposed from currently unallocated cards.${result.capped?' Limited to 200 packs per review.':''} Confirm only the versions that reflect your collection.</p>`:'<p class="muted">No complete pack can be allocated from your remaining card copies. Try the “Only 1–3 cards away” filter to see the closest matches.</p>'}`,`<button class="btn btn-secondary" data-action="close-modal">Cancel</button>${count?'<button class="btn btn-primary" data-action="commit-suggestion">Confirm this allocation</button>':''}`,'small');}

function modalHTML(){const m=ui.modal;if(!m)return '';switch(m.kind){case'card':return cardDialogHTML(m);case'pack':return packDialogHTML(m);case'play-deck':return playDeckDialogHTML(m);case'import':return importDialogHTML();case'compare':return compareDialogHTML(m);case'save':return saveDialogHTML(m);case'picker':return pickerHTML(m);case'guide':return guideHTML();case'search-help':return guideHTML(true);case'settings':return settingsHTML();case'about':return settingsHTML(true);default:return simpleModalHTML(m);}}

function captureFocus(){const el=document.activeElement;if(!el||el===document.body)return null;return {id:el.id,action:el.dataset?.action,key:el.dataset?.key,printing:el.dataset?.printing,slot:el.dataset?.slot,delta:el.dataset?.delta,deckId:el.dataset?.id,tab:el.dataset?.tab,theme:el.dataset?.theme,layout:el.dataset?.layout,mode:el.dataset?.mode,direction:el.dataset?.direction,start:el.selectionStart,end:el.selectionEnd};}
function restoreFocus(f,scope=document){if(!f)return;let el=f.id?scope.querySelector('#'+CSS.escape(f.id)):null;if(!el&&f.action){let sel=`[data-action="${CSS.escape(f.action)}"]`;if(f.key)sel+=`[data-key="${CSS.escape(f.key)}"]`;for(const [attr,value]of [['slot',f.slot],['delta',f.delta],['id',f.deckId],['tab',f.tab],['theme',f.theme],['layout',f.layout],['mode',f.mode],['direction',f.direction]])if(value!=null)sel+=`[data-${attr}="${CSS.escape(value)}"]`;el=scope.querySelector(sel);}if(el){el.focus({preventScroll:true});if(f.start!=null&&typeof el.setSelectionRange==='function')try{el.setSelectionRange(f.start,f.end);}catch{}}}
function render(){imageObserver?.disconnect();const f=captureFocus();const scrolls=[...root.querySelectorAll('[data-shelf]:not(button)')].map(el=>[el.dataset.shelf,el.scrollLeft]);derived=computeDerived();document.documentElement.style.setProperty('--pack-width',`${236*ui.zoom}px`);const view=({explore:exploreHTML,cards:cardLibraryHTML,collection:collectionHTML,pairings:pairingsHTML,saved:savedHTML})[ui.view]||exploreHTML;
 root.innerHTML=`${navHTML()}<div class="workspace">${topbarHTML()}${storageError?`<div class="storage-warning" role="alert">${icon('info')}${e(storageError)} <button class="text-button" data-action="settings">Settings</button></div>`:''}<main id="main" class="content" tabindex="-1">${view()}</main></div>${dockHTML()}`;
 for(const [id,left]of scrolls){const el=root.querySelector(`[data-shelf="${CSS.escape(id)}"]:not(button)`);if(el)el.scrollLeft=left;}
 restoreFocus(f,root);setupSpatial();lazyImages(root);if(ui.modal)renderModal(false);
}
function modalScrollState(){return {dialog:modalRoot.querySelector('.dialog')?.scrollTop||0,content:modalRoot.querySelector('.dialog-content')?.scrollTop||0,shelves:[...modalRoot.querySelectorAll('[data-shelf]:not(button)')].map(el=>[el.dataset.shelf,el.scrollLeft])};}
function renderModal(initial=false){
  const f=captureFocus();if(ui.modal&&!initial)ui.modal.scrollState=modalScrollState();
  const scroll=ui.modal?.scrollState||{dialog:0,content:0,shelves:[]};
  for(const img of modalRoot.querySelectorAll('img[data-src]'))imageObserver?.unobserve(img);
  modalRoot.innerHTML=modalHTML();document.body.classList.toggle('modal-open',!!ui.modal);root.inert=!!ui.modal;
  if(ui.modal){lazyImages(modalRoot);setupSpatial(modalRoot);const dialog=modalRoot.querySelector('.dialog'),content=modalRoot.querySelector('.dialog-content');if(dialog)dialog.scrollTop=scroll.dialog;if(content)content.scrollTop=scroll.content;
    for(const [id,left] of scroll.shelves){const shelf=modalRoot.querySelector(`[data-shelf="${CSS.escape(id)}"]:not(button)`);if(shelf)shelf.scrollLeft=left;}
    if(initial){const auto=modalRoot.querySelector('#saved-name,#picker-search,#csv-drop');(auto||dialog)?.focus({preventScroll:true});}else restoreFocus(f,modalRoot);
  }
}

function showModal(kind,data={},stack=false){if(ui.modal&&stack){ui.modal.scrollState=modalScrollState();ui.modalStack.push(ui.modal);}else if(!stack)ui.modalStack=[];if(!ui.modal)ui.opener=document.activeElement;ui.modal={kind,...data};renderModal(true);}

function closeModal(all=false){if(!all&&ui.modalStack.length){ui.modal=ui.modalStack.pop();renderModal(true);return;}ui.modal=null;ui.modalStack=[];modalRoot.innerHTML='';document.body.classList.remove('modal-open');root.inert=false;if(ui.opener?.isConnected)ui.opener.focus({preventScroll:true});else document.querySelector('#main')?.focus({preventScroll:true});ui.opener=null;}
function lazyImages(scope){if(!imageObserver)imageObserver=new IntersectionObserver(entries=>{for(const item of entries)if(item.isIntersecting){loadImage(item.target);imageObserver.unobserve(item.target);}},{rootMargin:'500px'});for(const img of scope.querySelectorAll('img[data-src]')){if(img.dataset.eager==='true')loadImage(img);else imageObserver.observe(img);}}
function loadImage(img){if(!img.dataset.src)return;img.onload=()=>{img.classList.add('loaded');img.style.opacity='1';};img.onerror=()=>{img.hidden=true;img.style.display='none';};img.src=img.dataset.src;delete img.dataset.src;}
function setupSpatial(scope=root){for(const shelf of scope.querySelectorAll('[data-shelf]:not(button)')){let drag=null;shelf.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'||event.button!==0||getComputedStyle(shelf).display==='grid')return;drag={x:event.clientX,left:shelf.scrollLeft,moved:false,id:event.pointerId};});shelf.addEventListener('pointermove',event=>{if(!drag||!event.buttons){drag=null;return;}const dx=event.clientX-drag.x;if(Math.abs(dx)>7){drag.moved=true;shelf.classList.add('dragging');shelf.scrollLeft=drag.left-dx;event.preventDefault();}});const finish=()=>{if(drag?.moved)suppressClickUntil=Date.now()+250;drag=null;shelf.classList.remove('dragging');};shelf.addEventListener('pointerup',finish);shelf.addEventListener('pointerleave',finish);shelf.addEventListener('dragstart',event=>event.preventDefault());}}
function updateURL(replace=false){const params=new URLSearchParams();if(ui.view==='cards'&&ui.search)params.set('q',ui.search);if(ui.view==='pairings'&&ui.pair.length)params.set('packs',ui.pair.join(','));if(ui.view==='explore'&&ui.expanded?.id)params.set('pack',ui.expanded.id);const hash='#'+ui.view+(params.size?'?'+params.toString():'');if(location.hash!==hash)try{history[replace?'replaceState':'pushState']({},'',hash);}catch{location.hash=hash;}}
function readRoute(){const [view,query='']=location.hash.slice(1).split('?');if(!view){ui.view='explore';return;}if(!['explore','cards','collection','pairings','saved'].includes(view))return;ui.view=view;const p=new URLSearchParams(query);if(ui.view==='cards')ui.search=p.get('q')||'';if(ui.view==='pairings'&&p.has('packs')){const pair=p.get('packs').split(',');if(pair.length<=2&&pair.every(id=>idx.decks.has(id)))ui.pair=pair;}if(ui.view==='explore'&&idx.decks.has(p.get('pack'))){const d=idx.decks.get(p.get('pack'));ui.expanded={theme:d.themeId,id:d.id};}}
function navigate(view,{top=true}={}){if(!['explore','cards','collection','pairings','saved'].includes(view))return;closeModal(true);ui.view=view;ui.mobileOpen=false;updateURL();render();if(view==='cards')scheduleLibrarySearch();if(top)window.scrollTo({top:0,behavior:'instant'});document.getElementById('main')?.focus({preventScroll:true});}
function revealPack(id,button=null){showPack(id,button);}

function pairAdd(id,slot=null){if(!idx.decks.has(id))return;if(slot!==null){if(slot===1&&!ui.pair[0])ui.pair=[id];else ui.pair[slot]=id;}else if(ui.pair.length<2)ui.pair.push(id);else{showModal('picker',{slot:1,query:idx.decks.get(id).name});toast('Your two slots are full. Choose a replacement for pack 2.');return;}updateURL(true);closeModal(true);render();toast(`${idx.decks.get(id).name} v${idx.decks.get(id).variant} added to your mix.`);}
function randomPair(){const options=filteredPairs();if(!options.length){toast('No pairings match the current mixing-room filters.',true);return;}let n;if(globalThis.crypto?.getRandomValues){const v=new Uint32Array(1);crypto.getRandomValues(v);n=v[0]%options.length;}else n=Math.floor(Math.random()*options.length);ui.pair=[...options[n]];navigate('pairings');toast('A fresh combination, ready to explore.');}
function backupExport(){downloadText('jumpstart-atlas-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(collection,null,2),'application/json');}
function recalculateImport(){const m=ui.import;if(!m?.parsed)return;try{m.result=analyzeCSV(m.parsed,idx,{mapping:m.mapping,j25Only:m.j25Only,includeBasics:collection.settings.includeBasics});m.error='';}catch(error){m.result=null;m.error=error.message;}renderModal();}
async function readCSVFile(file){if(!file)return;ui.import={mode:'replace',j25Only:false,confirmGroups:false,skipIssues:false,fileName:file.name};try{if(file.size>10*1024*1024)throw new Error('Choose a CSV smaller than 10 MB.');const bytes=new Uint8Array(await file.arrayBuffer());const encoding=bytes[0]===0xff&&bytes[1]===0xfe?'utf-16le':bytes[0]===0xfe&&bytes[1]===0xff?'utf-16be':'utf-8';const text=new TextDecoder(encoding,{fatal:true}).decode(bytes);ui.import.parsed=parseCSV(text);ui.import.mapping=inferColumns(ui.import.parsed.headers);recalculateImport();}catch(error){ui.import.error=error.message;renderModal();}}
function sampleCSV(){const ds=[idx.decks.get('angels-2'),idx.decks.get('ninjas-1')];const lines=['Name,Quantity,Set,Pack'];ds.forEach((d,i)=>d.cards.forEach(c=>lines.push([c.name,c.quantity,'J25','Example pack '+(i+1)].map(csvCell).join(','))));idx.decks.get('elves-1').cards.filter(c=>!c.isLand).slice(0,5).forEach(c=>lines.push([c.name,c.quantity,'J25','Loose example cards'].map(csvCell).join(',')));return lines.join('\r\n');}
function commitImport(){const m=ui.import,r=m?.result;if(!r||!r.total||r.issues.length&&!m.skipIssues)return;let next=structuredClone(collection);next.inventory=m.mode==='add'?mergeCounts(next.inventory,r.inventory):{...r.inventory};if(m.mode==='replace'&&m.resetAllocations)next.allocations={};if(Object.values(next.inventory).some(q=>q>MAX_QUANTITY)){toast('Adding this file would exceed the per-card quantity limit.',true);return;}if(m.confirmGroups){for(const g of r.groupMatches.filter(g=>g.exact.length===1)){const id=g.exact[0],available=remainingInventory(next.inventory,next.allocations,idx,next.settings.includeBasics);if(deckCoverage(idx.decks.get(id),available,next.settings.includeBasics).complete)next.allocations[id]=(next.allocations[id]||0)+1;}}
 if(saveCollection(next,`${r.total.toLocaleString()} card copies ${m.mode==='add'?'added':'imported'}. Review your variant matches.`,true)){closeModal(true);ui.import=null;ui.collectionTab='matches';navigate('collection');}}
function commitPack(id,mode){const d=idx.decks.get(id);if(!d)return;const next=structuredClone(collection);if(mode==='add')next.inventory=mergeCounts(next.inventory,requirements([d],true));else if(!deckCoverage(d,remainingInventory(next.inventory,next.allocations,idx,next.settings.includeBasics),next.settings.includeBasics).complete){toast('Those copies are no longer available. Review the current matches.',true);render();return;}next.allocations[id]=(next.allocations[id]||0)+1;if(saveCollection(next,`${d.name} v${d.variant} confirmed${mode==='add'?' · 20 cards added':''}.`))closeModal();}
async function restoreFile(file){if(!file)return;try{if(file.size>10*1024*1024)throw new Error('Backup must be smaller than 10 MB.');const backup=validateBackup(JSON.parse(await file.text()),idx);showModal('restore',{backup,fileName:file.name});}catch(error){toast('Backup not restored: '+error.message,true);}}
async function syncCards(force=false){if(scryfall.busy)return;ui.connection='loading';ui.syncMessage='';render();try{const result=await scryfall.load({force,onProgress:progress=>{hydrateIndex(idx,progress.cards);ui.cardCount=[...idx.cards.values()].reduce((n,c)=>n+c.printings.length,0);if(progress.complete)ui.completeData=true;ui.lastSync=progress.date;ui.connection=progress.cached?'cached':progress.complete?'online':'loading';render();}});if(result?.cards?.length){ui.syncMessage=result.persisted===false?'Card data loaded, but browser caching is unavailable.':'Card metadata is cached on this device.';if(ui.import?.parsed)recalculateImport();}}catch(error){ui.connection=ui.completeData?'cached':ui.cardCount?'partial':'offline';ui.syncMessage=error.name==='AbortError'?'Scryfall timed out. Decklists and collection data are unaffected.':error.message;render();if(force)toast('Card sync could not finish. Your collection is unaffected.',true);}}
async function loadRulings(){const m=ui.modal;if(m?.kind!=='card'||m.rulesLoading)return;m.rulesLoading=true;m.rulesError='';renderModal();try{m.rulings=await scryfall.rulings(idx.cards.get(m.key));}catch(error){m.rulesError=error.name==='AbortError'?'The rulings request timed out. Try again.':error.message;}finally{m.rulesLoading=false;if(ui.modal===m)renderModal();}}
async function cacheAllArt(){if(!('caches'in window)||!navigator.serviceWorker?.controller){toast('Offline caching becomes available after the service worker activates. Reload this static-server edition once.',true);return;}if(ui.cacheProgress)return;const urls=[...new Set([...idx.cards.values()].flatMap(c=>c.printings.flatMap(p=>[p.image_uris?.normal,p.image_uris?.art_crop])).filter(u=>safeURL(u).startsWith('https://')))];if(!urls.length)return;artCancel=false;ui.cacheProgress={done:0,total:urls.length,failed:0};renderModal();let cursor=0;const cache=await caches.open('jumpstart-atlas-images-v1');async function worker(){while(cursor<urls.length&&!artCancel){const url=urls[cursor++];try{if(!await cache.match(url)){const response=await fetch(url,{signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error('Image unavailable');await cache.put(url,response);}}catch{ui.cacheProgress.failed++;}ui.cacheProgress.done++;if(ui.modal?.kind==='settings')renderModal();await new Promise(r=>setTimeout(r,220));}}await Promise.all([worker(),worker()]);const {done,failed}=ui.cacheProgress;ui.cacheProgress=null;if(ui.modal?.kind==='settings')renderModal();toast(`${artCancel?'Stopped':'Finished'}: ${done-failed} images cached${failed?', '+failed+' unavailable':''}.`,failed>0);}
function saveRecipe(event){event.preventDefault();const m=ui.modal;if(m?.kind!=='save')return;const form=event.target;if(!form.reportValidity())return;const name=form.elements.name.value.trim(),notes=form.elements.notes.value.trim(),favorite=form.elements.favorite.checked;if(!name){form.elements.name.setCustomValidity('Add a name for this play deck.');form.elements.name.reportValidity();return;}const old=m.id?collection.saved.find(s=>s.id===m.id):null;const pair=m.pair||old?.pair||ui.pair;if(pair.length!==2)return;const next=structuredClone(collection);const record={id:old?.id||globalThis.crypto?.randomUUID?.()||'deck-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,notes,favorite,pair:[...pair],createdAt:old?.createdAt||new Date().toISOString()};if(old)next.saved=next.saved.map(s=>s.id===old.id?record:s);else next.saved.push(record);if(saveCollection(next,old?'Play deck updated.':'Your combination is saved.')){closeModal(true);navigate('saved');}}

 case'menu':ui.mobileOpen=true;render();break;case'close-menu':ui.mobileOpen=false;render();break;

 case'focus-search':navigate('cards');requestAnimationFrame(()=>document.getElementById('card-search')?.focus());break;
 case'layout':ui.mode=button.dataset.mode;savePreferences();render();break;
 case'list-layout':if(Object.hasOwn(ui.layouts,button.dataset.layout)&&['grid','shelves'].includes(button.dataset.mode)){ui.layouts[button.dataset.layout]=button.dataset.mode;savePreferences();render();}break;
 case'dialog-step':stepDialog(Number(button.dataset.direction));break;
 case'pack-dialog':showPack(id,button);break;

function hidePrintPreview(){const box=document.getElementById('card-hover-preview');if(!box)return;box.classList.remove('show');box.hidden=true;box.innerHTML='';box.style.left='';box.style.top='';document.querySelectorAll('.printing-item[aria-expanded="true"]').forEach(el=>el.setAttribute('aria-expanded','false'));}
function placePrintPreview(event){const box=document.getElementById('card-hover-preview');if(!box||box.hidden)return;const w=box.offsetWidth||220,h=box.offsetHeight||300;let x=(event.clientX??0)+14,y=(event.clientY??0)+14;if(x+w>window.innerWidth-8)x=(event.clientX??0)-w-14;if(y+h>window.innerHeight-8)y=(event.clientY??0)-h-14;box.style.left=Math.max(8,x)+'px';box.style.top=Math.max(8,y)+'px';}
function showPrintPreview(button,event){const url=safeURL(button.dataset.hoverImage||'');const box=document.getElementById('card-hover-preview');if(!box||!url)return;hidePrintPreview();button.setAttribute('aria-expanded','true');box.innerHTML=`<img src="${e(url)}" alt="">`;box.hidden=false;box.classList.add('show');placePrintPreview(event||{clientX:button.getBoundingClientRect().right,clientY:button.getBoundingClientRect().top});}
function togglePrintPreview(button,event){const coarse=window.matchMedia('(hover: none)').matches||event?.pointerType==='touch';if(!coarse&&event?.pointerType==='mouse')return;event?.stopPropagation();const box=document.getElementById('card-hover-preview');const open=box&&!box.hidden&&button.getAttribute('aria-expanded')==='true';if(open)hidePrintPreview();else showPrintPreview(button,event);}
document.addEventListener('click',event=>{if(Date.now()<suppressClickUntil){event.preventDefault();return;}if(event.target.classList.contains('dialog-backdrop')){closeModal();return;}const button=event.target.closest('[data-action]');if(!button&&isCompact()){const recipe=event.target.closest('.pair-card[data-recipe]'),pack=event.target.closest('[data-pack-id]');if(recipe){showPlayDeck(recipe.dataset.recipe.split(','),recipe.dataset.savedId||null,recipe);return;}if(pack){showPack(pack.dataset.packId,pack);return;}}if(!button||button.disabled)return;event.preventDefault();Promise.resolve(handleAction(button,event)).catch(error=>{console.error(error);toast(error.message||'That action could not finish.',true);});});
document.addEventListener('submit',event=>{if(event.target.id==='save-deck-form')saveRecipe(event);});
document.addEventListener('input',event=>{const el=event.target;const id=el.id;let redraw=true;
 if(id==='card-search'){ui.search=el.value;ui.cardPage=1;updateURL(true);scheduleLibrarySearch();}else if(id==='theme-search')ui.themeQuery=el.value;
 else if(id==='inventory-search'){ui.inventoryQuery=el.value;ui.inventoryPage=1;}else if(id==='pair-search'){ui.pairQuery=el.value;ui.pairPage=1;}else if(id==='saved-search')ui.savedQuery=el.value;
 else if(id==='picker-search'){if(ui.modal)ui.modal.query=el.value;clearTimeout(inputTimer);inputTimer=setTimeout(()=>renderModal(),120);return;}
 else if(id.startsWith('adv-')){const map={'adv-name':'name','adv-oracle':'oracle','adv-type':'type','adv-mana':'mana','adv-artist':'artist','adv-flavor':'flavor','adv-lore':'lore','adv-criteria':'criteria','adv-set':'set','adv-stat-val':'statVal','adv-price-val':'priceVal'};const key=map[id];if(key){ui.cardFilters[key]=el.value;applyAdvancedQuery();}}
 else if(id==='saved-name'){ui.modal.draftName=el.value;el.setCustomValidity('');redraw=false;}else if(id==='saved-notes'){ui.modal.draftNotes=el.value;redraw=false;}else redraw=false;
 if(redraw){clearTimeout(inputTimer);inputTimer=setTimeout(render,140);}

document.addEventListener('change',event=>{const el=event.target,id=el.id;try{

 else if(id==='hide-lands')ui.cardFilters.hideLands=el.checked;else if(id==='card-printings')ui.showPrintings=el.checked;else if(id==='card-sort')ui.cardSort=el.value;

 if(id.startsWith('search-')||id.startsWith('adv-')||['hide-lands','card-printings','card-sort'].includes(id))ui.cardPage=1;if(id.startsWith('pair-')||id==='identical-pairs')ui.pairPage=1;render();

document.addEventListener('keydown',event=>{const el=document.activeElement,editing=el?.matches('input,textarea,select,[contenteditable="true"]');
 if(event.key==='Escape'){if(ui.modal)closeModal();else if(ui.mobileOpen){ui.mobileOpen=false;render();}else if(ui.expanded){ui.expanded=null;updateURL(true);render();}return;}

 if(!editing&&ui.modal?.navigation&&['ArrowLeft','ArrowRight'].includes(event.key)&&!el?.closest('[role=tablist]')){event.preventDefault();stepDialog(event.key==='ArrowLeft'?-1:1);return;}
 if(editing||ui.modal)return;const pack=el?.closest('.pack');if(pack&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
  event.preventDefault();const lane=pack.closest('.lane'),packs=[...lane.querySelectorAll('.pack')],position=packs.indexOf(pack);let target;

  else {const lanes=[...root.querySelectorAll('.lane')],ln=lanes[lanes.indexOf(lane)+(event.key==='ArrowUp'?-1:1)];if(ln){const pp=[...ln.querySelectorAll('.pack')];target=pp[Math.min(position,pp.length-1)];}}
  target?.querySelector('.pack-main')?.focus({preventScroll:true});target?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
 }
